# FOMS pytest 설정 SSOT (CI-PYTEST-01)
#
# 2026-08-26 이전까지 이 저장소에는 pytest.ini / setup.cfg / pyproject.toml 이
# 하나도 없었다. 그래서 rootdir 과 수집 규칙이 호출 위치에 따라 암묵적으로
# 정해졌고, 실행 옵션은 .github/workflows/ci.yml 과 개발자 머리속에만 있었다.
# "내 컴퓨터선 되는데" 를 줄이려고 한 곳에 못 박는다.
#
# 여기에는 **동작을 바꾸지 않는 것만** 넣는다. addopts 로 옵션을 강제하지 않는다:
# 메인 레인은 -p no:playwright 로 돌지만 tests/visual 은 playwright 가 필요하고,
# 레인마다 필요한 옵션이 달라서 전역 강제는 레인 하나를 조용히 망가뜨린다.

[pytest]
# 인자 없이 `pytest` 만 쳤을 때 저장소 전체가 아니라 tests/ 만 수집한다.
# CI 는 경로를 명시해 호출하므로 CI 동작에는 영향이 없다.
testpaths = tests

# 수집 대상 이름 규칙(pytest 기본값과 동일 — 명시해서 고정한다).
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 테스트가 들어있지 않은 트리는 걷지 않는다. tests/visual/artifacts 는 PNG
# 산출물 디렉토리라 수집할 것이 없다.
norecursedirs = .git .venv venv node_modules __pycache__ *.egg-info artifacts .pytest_cache
