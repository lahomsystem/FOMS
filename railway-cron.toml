# Cron 서비스 전용 Railway Config (P0-00C)
# Railway 대시보드 > Cron 서비스 > Settings > Config Path: railway-cron.toml
# FOMS-DEV·FOMS-PRODUCTION 의 `FOMS-cron` 서비스가 **둘 다** 이 파일을 읽는다(2026-09-11 실측).
#
# REV-CLEANUP-01 / AUDIT-LOG T9 — retention purge 2종을 여기에 체이닝한다.
# 원설계는 별도 cron 서비스(`railway-cron-receipt-purge.toml`)였는데 그 서비스가 두 프로젝트
# 어디에도 등록되지 않아 purge 가 한 번도 돌지 않았다(2026-09-11 운영 실측: 보존 7일짜리
# `order_mutation_receipts` 에 7일 초과 행 6,329건 잔존). 서비스를 증설하는 대신 **이미 도는**
# cron 에 붙여 "등록 누락"이라는 실패 모양 자체를 없앤다.
# 2026-09-29: 위 체이닝(`A && B && C`)도 한 번도 purge 를 돌리지 못했다 — 이 서비스는 실제로
# 루트 Dockerfile 로 빌드되고, Dockerfile 서비스의 startCommand 는 셸 없이 exec 되어 첫 명령만
# 돌았다(운영 만료 receipt 2952건 잔존). 그래서 startCommand 는 셸 문법 없는 러너 한 줄이다 —
# 단계 목록·인자·단계별 제한 시간은 tools/cron/nightly.py 의 NIGHTLY_STEPS 가 정본이다. 단계는
# 서로 독립(앞 단계가 실패해도 다음 단계를 돈다)이고, 셋 다 배치 commit·advisory lock 이라 다음 날
# 실행이 곧 복구다. 스펙: docs/specs/2026-09-29-nightly-cron-single-runner-spec.md
[build]
builder = "nixpacks"

[deploy]
startCommand = "python tools/cron/nightly.py"
cronSchedule = "0 17 * * *"  # UTC 17:00 = KST 02:00
