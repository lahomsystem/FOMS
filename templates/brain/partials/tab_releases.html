{#- 화면 6 판 — 판 목록 · 차이 요약(보기 범위 안의 바뀜만 센다) · 층 되돌리기(ADMIN 만 — 같은 판 번호를 한 번 더 넣어 확인).
    목록은 brain-releases.js 가 GET /api/brain/releases 로 읽고, 되돌리기는 POST /api/brain/releases/<번호>/rollback. -#}
<section class="tab-pane fade{{ ' show active' if tab == 'releases' else '' }} brain-pane" id="brain-tab-releases" role="tabpanel"
         aria-labelledby="brain-tab-releases-btn" tabindex="0">
  <p class="brain-head__note">판은 하루에 하나씩 생겨요. 층 되돌리기는 사장님만 하고, 되돌려도 기록은 남아요.
    지식 하나만 되돌릴 땐 그 지식의 '수정 기록'에서 해요.</p>
  <p class="brain-status-line" data-brain-releases-status role="status" aria-live="polite"></p>
  <ol class="brain-releases" data-brain-releases></ol>
  <nav class="brain-pager" aria-label="판 목록 쪽">
    <button type="button" class="brain-btn" data-brain-releases-prev disabled>이전</button>
    <span class="brain-pager__text" data-brain-releases-text></span>
    <button type="button" class="brain-btn" data-brain-releases-next disabled>다음</button>
  </nav>
</section>
