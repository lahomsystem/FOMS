<style>
  /* 테이블: 컬럼이 화면에 다 보이도록 가로 스크롤 보장 */
  .erp-drawing-workbench-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-right: 30px; /* 스크롤바 공간 확보 */
  }
  .erp-drawing-workbench-table-wrap table {
    min-width: 62.5rem;
  }
  
  /* 대시보드 카드 바디 - 스크롤바 공간 */
  .erp-pro-card .card-body {
    overflow: visible;
  }
  
  /* 마지막 컬럼에 충분한 공간 확보 */
  .erp-drawing-workbench-table-wrap th:last-child,
  .erp-drawing-workbench-table-wrap td:last-child {
    padding-right: 50px !important;
    white-space: nowrap;
  }
  
  /* 대시보드 전체에 우측 공간 */
  .erp-pro-card.mb-3 {
    padding-right: 20px;
  }

  /* ERP 프로세스 맵 스타일(컴팩트) */
  .dw-process-map .erp-pro-card__body {
    padding: 10px 12px;
  }
  .dw-process-map .erp-pro-pipeline {
    gap: 8px;
  }
  .dw-process-map .erp-pro-pipeline__stage {
    min-width: 92px;
    padding: 0.45rem 0.5rem !important;
    cursor: pointer;
  }
  .dw-process-map .erp-pro-pipeline__count {
    font-size: 1rem;
    line-height: 1.05;
  }
  .dw-process-map .erp-pro-pipeline__label {
    font-size: 0.76rem;
    line-height: 1.1;
    margin-top: 3px;
  }
  .dw-process-map .erp-pro-pipeline__connector {
    opacity: 0.45;
  }
  
  /* Phase 5: 모바일 카드 레이아웃 */
  .erp-drawing-mobile-list__summary {
    display: none;
  }
  .mobile-order-card {
    cursor: pointer;
    transition: box-shadow 0.2s ease;
  }
  .mobile-order-card:active {
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
  }
  .mobile-order-card:focus-visible,
  .erp-drawing-mobile-card__action:focus-visible {
    outline: 2px solid #0a6ed1;
    outline-offset: 2px;
  }
  
  @media (max-width: 991.98px) {
    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-workbench-table-wrap {
      display: none !important;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-list {
      display: grid;
      gap: 0.875rem;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-list__summary {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-list__eyebrow {
      display: block;
      margin-bottom: 0.125rem;
      color: #556b82;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-list__title {
      margin: 0;
      color: #131e29;
      font-size: 1rem;
      font-weight: 700;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-list__count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: #ebf8ff;
      color: #0057d2;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .mobile-order-card.erp-drawing-mobile-card {
      margin-bottom: 0;
      border: 1px solid #dfe7f3;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 2px 12px rgba(17, 24, 39, 0.08);
      overflow: hidden;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card .card-body {
      padding: 1rem;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card__topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.875rem;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card__title {
      color: #131e29;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card__sub {
      margin-top: 0.25rem;
      color: #556b82;
      font-size: 0.8125rem;
      line-height: 1.4;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card__status {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0.125rem 0.625rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card__meta {
      display: grid;
      gap: 0.625rem;
      margin-bottom: 0.875rem;
      font-size: 0.875rem;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card__meta-row {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 0.625rem;
      align-items: start;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card__meta-row strong {
      color: #556b82;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card__chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-bottom: 0.875rem;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card__chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0.125rem 0.625rem;
      border-radius: 999px;
      background: #f7f7f7;
      color: #556b82;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card__actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.625rem;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card__action {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      padding: 0.625rem 0.875rem;
      border-radius: 12px;
      border: 1px solid #d9d9d9;
      background: #fff;
      color: #131e29;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 700;
    }

    .erp-mobile-shell[data-erp-mobile-v2='true'] .erp-drawing-mobile-card__action.is-primary {
      border-color: rgba(0, 112, 242, 0.22);
      background: #f7fbff;
      color: #0057d2;
    }
  }
  
  @media (max-width: 768px) {
    .erp-pro-filter-form--inline-mobile {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .erp-pro-filter-group {
      width: 100%;
    }
    .erp-pro-input {
      width: 100%;
    }
  }

  .dw-order-change-badge {
    font-weight: 600;
    background: #fce7f3 !important;
    color: #9d174d !important;
    border: 1px solid #f9a8d4;
  }

  /* 담당 미지정 배지 — dw-order-change-badge 문법의 danger(빨강) 변형. */
  .dw-order-unassigned-badge {
    font-weight: 600;
    background: #fee2e2 !important;
    color: #b91c1c !important;
    border: 1px solid #fca5a5;
  }

  /* 최근 이벤트 타입 칩 — 기본은 무채, 액션별로 팔레트 토큰 톤만 갈아끼운다. */
  .dw-event-chip {
    display: inline-block;
    padding: 0.05rem 0.4rem;
    border-radius: 999px;
    border: 1px solid #d9d9d9;
    background: #f4f4f5;
    color: #52525b;
    font-size: 0.7rem;
    font-weight: 700;
    line-height: 1.45;
    white-space: nowrap;
  }
  .dw-event-chip.is-order-change {
    background: var(--foms-color-warning-50, #fffbeb);
    border-color: var(--foms-color-warning-500, #f59e0b);
    color: var(--foms-color-warning-700, #b45309);
  }
  .dw-event-chip.is-revision {
    background: var(--foms-color-danger-50, #fef2f2);
    border-color: var(--foms-color-danger-500, #ef4444);
    color: var(--foms-color-danger-600, #dc2626);
  }
  .dw-event-chip.is-transfer {
    background: var(--foms-color-info-50, #eff6ff);
    border-color: var(--foms-color-info-500, #3b82f6);
    color: var(--foms-color-info-600, #2563eb);
  }

  /* 시공일 뱃지 3단 임박도(+ 무일정) — 색상은 팔레트 토큰(fallback 허용). */
  .dw-cdate-cell {
    font-size: 1rem;
    color: #495057;
  }
  .dw-cdate-badge {
    border: 1px solid transparent;
    font-weight: 700;
    white-space: nowrap;
  }
  .dw-cdate-badge.is-none {
    background: #f4f4f5;
    border-color: #d9d9d9;
    color: #52525b;
  }
  .dw-cdate-badge.is-danger {
    background: var(--foms-color-danger-50, #fef2f2);
    border-color: var(--foms-color-danger-500, #ef4444);
    color: var(--foms-color-danger-600, #dc2626);
  }
  .dw-cdate-badge.is-warn {
    background: var(--foms-color-warning-50, #fffbeb);
    border-color: var(--foms-color-warning-500, #f59e0b);
    color: var(--foms-color-warning-700, #b45309);
  }
  .dw-cdate-badge.is-info {
    background: var(--foms-color-info-50, #eff6ff);
    border-color: var(--foms-color-info-500, #3b82f6);
    color: var(--foms-color-info-600, #2563eb);
  }

  /* 최근 이벤트 세로 스택 — 변경 항목 1줄씩, 3개 이상은 details 로 접는다. */
  .dw-event-part {
    line-height: 1.35;
    word-break: break-word;
  }
  .dw-event-part + .dw-event-part {
    margin-top: 0.1rem;
  }
  .dw-event-more {
    margin-top: 0.15rem;
  }
  .dw-event-more > summary {
    cursor: pointer;
    color: var(--foms-color-info-600, #2563eb);
    font-weight: 600;
  }
  .dw-event-more[open] > summary {
    color: #6c757d;
  }

  /* 목록 컬럼 폭 고정 — 필터·정렬로 내용이 바뀌어도 좁은 컬럼이 흔들리지 않게.
     고정 레이아웃(table-layout)은 금지 — 긴 최근 이벤트 셀이 깨진다. 폭 힌트 + nowrap 조합만.
     컬럼 순서: 1 체크 · 2 주문/고객 · 3 시공일 · 4 다음 액션 · 5 도면 담당 · 6 상태
                · 7 대상 번호 · 8 최근 이벤트 · 9 SLA · 10 미확인 · 11 열기
     (2·4·8 은 가변 유지) */
  .erp-drawing-workbench-table-wrap th:nth-child(3),
  .erp-drawing-workbench-table-wrap td:nth-child(3) {
    width: 110px;
  }
  .erp-drawing-workbench-table-wrap th:nth-child(5),
  .erp-drawing-workbench-table-wrap td:nth-child(5) {
    width: 90px;
  }
  .erp-drawing-workbench-table-wrap th:nth-child(6),
  .erp-drawing-workbench-table-wrap td:nth-child(6) {
    width: 110px;
  }
  .erp-drawing-workbench-table-wrap th:nth-child(7),
  .erp-drawing-workbench-table-wrap td:nth-child(7) {
    width: 70px;
  }
  .erp-drawing-workbench-table-wrap th:nth-child(9),
  .erp-drawing-workbench-table-wrap td:nth-child(9) {
    width: 80px;
  }
  .erp-drawing-workbench-table-wrap th:nth-child(10),
  .erp-drawing-workbench-table-wrap td:nth-child(10) {
    width: 70px;
  }
  .erp-drawing-workbench-table-wrap th:nth-child(11),
  .erp-drawing-workbench-table-wrap td:nth-child(11) {
    width: 100px;
  }
  /* 줄바꿈 금지는 단일 토큰 컬럼에만. 3번(시공일)은 복수 일정 뱃지가 세로로 쌓여야 해서 제외. */
  .erp-drawing-workbench-table-wrap th:nth-child(3),
  .erp-drawing-workbench-table-wrap th:nth-child(5),
  .erp-drawing-workbench-table-wrap td:nth-child(5),
  .erp-drawing-workbench-table-wrap th:nth-child(6),
  .erp-drawing-workbench-table-wrap td:nth-child(6),
  .erp-drawing-workbench-table-wrap th:nth-child(7),
  .erp-drawing-workbench-table-wrap td:nth-child(7),
  .erp-drawing-workbench-table-wrap th:nth-child(9),
  .erp-drawing-workbench-table-wrap td:nth-child(9),
  .erp-drawing-workbench-table-wrap th:nth-child(10),
  .erp-drawing-workbench-table-wrap td:nth-child(10) {
    white-space: nowrap;
  }

  /* 다음 액션 턴 시각화 — 내 턴은 진하게, 상대 턴은 흐리게, 담당 미지정은 경고 톤. */
  .dw-next-action.is-mine {
    color: #131e29;
    font-weight: 700;
  }
  .dw-next-action.is-other {
    color: #6c757d;
  }
  .dw-next-action.is-assign {
    color: #b91c1c;
    font-weight: 700;
  }
</style>
