{% set measurement_js_v = '20260703b' %}
{# 실측 대시보드 JS는 measurement-entry.js 가 순차 로드 (fragment 재실행 시 스크립트 이중 실행 방지) #}
<script src="{{ url_for('static', filename='js/measurement/measurement-entry.js') }}?v={{ measurement_js_v }}" defer></script>
<script>
  (function () {
    function focusRequestedMeasurementRow() {
      var urlParams = new URLSearchParams(window.location.search);
      var focusOrder = urlParams.get('focus_order');
      if (!focusOrder) return;
      setTimeout(function () {
        var row = document.querySelector('tr.measurement-row[data-order-id="' + focusOrder + '"]') || document.querySelector('tr[data-order-id="' + focusOrder + '"]');
        if (row) {
          row.scrollIntoView({ behavior: 'smooth', block: 'center' });
          row.classList.add('table-info');
          setTimeout(function () { row.classList.remove('table-info'); }, 2500);
        }
      }, 400);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', focusRequestedMeasurementRow);
    } else {
      focusRequestedMeasurementRow();
    }
    // fragment 스왑 시에는 DOMContentLoaded 가 다시 오지 않으므로 표준 이벤트로 재실행 (1회 등록)
    if (!window.__fomsMeasurementFocusBound) {
      window.__fomsMeasurementFocusBound = true;
      document.addEventListener('foms:erp-shell-fragment-swapped', focusRequestedMeasurementRow);
    }
  })();
  (function () {
    function openDrawingGatewayImageViewer(groupKey, index) {
      if (!window.GlobalImageViewer) return;
      var thumbs = Array.prototype.filter.call(
        document.querySelectorAll('[data-group-key][data-view-url]'),
        function (el) { return String(el.dataset.groupKey || '') === String(groupKey); }
      );
      var files = thumbs.map(function (el) {
        return {
          view_url: el.dataset.viewUrl || '',
          download_url: el.dataset.downloadUrl || '',
          filename: el.dataset.filename || '이미지',
          key: el.dataset.key || ''
        };
      }).filter(function (f) { return !!f.view_url; });
      if (!files.length) return;
      window.GlobalImageViewer.open(files, index || 0);
    }
    window.openDrawingGatewayImageViewer = openDrawingGatewayImageViewer;
  })();
</script>
