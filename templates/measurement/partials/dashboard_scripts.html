{% set measurement_js_v = '20260401u' %}
<script src="{{ url_for('static', filename='js/runtime/common_utils.js') }}?v={{ measurement_js_v }}"></script>
<script src="{{ url_for('static', filename='js/measurement/dashboard.js') }}?v={{ measurement_js_v }}"></script>
<script src="{{ url_for('static', filename='js/measurement/mobile.js') }}?v={{ measurement_js_v }}"></script>
<script src="{{ url_for('static', filename='js/runtime/column-resizer.js') }}?v={{ measurement_js_v }}"></script>
<script src="{{ url_for('static', filename='js/measurement/dashboard-columns.js') }}?v={{ measurement_js_v }}"></script>
<script src="{{ url_for('static', filename='js/measurement/manual-rows.js') }}?v={{ measurement_js_v }}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="{{ url_for('static', filename='js/measurement/image-export.js') }}?v={{ measurement_js_v }}"></script>
<script>
  (function () {
    document.addEventListener('DOMContentLoaded', function () {
      var urlParams = new URLSearchParams(window.location.search);
      var focusOrder = urlParams.get('focus_order');
      if (focusOrder) {
        setTimeout(function () {
          var row = document.querySelector('tr.measurement-row[data-order-id="' + focusOrder + '"]') || document.querySelector('tr[data-order-id="' + focusOrder + '"]');
          if (row) {
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            row.classList.add('table-info');
            setTimeout(function () { row.classList.remove('table-info'); }, 2500);
          }
        }, 400);
      }
    });
  })();
  (function () {
    function openDrawingGatewayImageViewer(groupKey, index) {
      if (!window.GlobalImageViewer) return;
      var thumbs = Array.prototype.filter.call(
        document.querySelectorAll('[data-group-key][data-view-url]'),
        function (el) { return String(el.dataset.groupKey || '') === String(groupKey); }
      );
      var files = thumbs.map(function (el) {
        return {
          view_url: el.dataset.viewUrl || '',
          download_url: el.dataset.downloadUrl || '',
          filename: el.dataset.filename || '이미지',
          key: el.dataset.key || ''
        };
      }).filter(function (f) { return !!f.view_url; });
      if (!files.length) return;
      window.GlobalImageViewer.open(files, index || 0);
    }
    window.openDrawingGatewayImageViewer = openDrawingGatewayImageViewer;
  })();
</script>
