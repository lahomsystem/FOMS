{% set measurement_js_v = '20260901a' %}
{# 실측 대시보드 JS는 measurement-entry.js 가 순차 로드 (fragment 재실행 시 스크립트 이중 실행 방지) #}
<script src="{{ url_for('static', filename='js/measurement/measurement-entry.js') }}?v={{ measurement_js_v }}" defer></script>
<script>
  (function () {
    // 동행 전달 [전달 완료] 핸들러(스펙 §6.2)를 문서당 1회만 싣는다.
    // 여기에 외부 script 태그를 하나 더 두면 셸 스왑마다 파편 안의 모든 스크립트가
    // 재파싱·재실행된다(perf 가드 _scan_fragment_multi_script · 실측탭 5.8s 사건).
    // entry 와 같은 singleton 동적 로드 패턴으로, 스왑에는 아무 비용도 들지 않는다.
    // 자산 핀: 20260909a (SW staticCacheFirst 가 옛 파일을 서빙하지 않게).
    if (window.__fomsMeasurementSalesDeliveryLoading) return;
    window.__fomsMeasurementSalesDeliveryLoading = true;
    var script = document.createElement('script');
    script.src = '/static/js/measurement/measurement-sales-delivery.js?v=20260909a';
    script.defer = true;
    document.head.appendChild(script);
  })();
  (function () {
    function focusRequestedMeasurementRow() {
      var urlParams = new URLSearchParams(window.location.search);
      var focusOrder = urlParams.get('focus_order');
      if (!focusOrder) return;
      setTimeout(function () {
        var row = document.querySelector('tr.measurement-row[data-order-id="' + focusOrder + '"]') || document.querySelector('tr[data-order-id="' + focusOrder + '"]');
        if (row) {
          row.scrollIntoView({ behavior: 'smooth', block: 'center' });
          row.classList.add('table-info');
          setTimeout(function () { row.classList.remove('table-info'); }, 2500);
        }
      }, 400);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', focusRequestedMeasurementRow);
    } else {
      focusRequestedMeasurementRow();
    }
    // fragment 스왑 시에는 DOMContentLoaded 가 다시 오지 않으므로 표준 이벤트로 재실행 (1회 등록)
    if (!window.__fomsMeasurementFocusBound) {
      window.__fomsMeasurementFocusBound = true;
      document.addEventListener('foms:erp-shell-fragment-swapped', focusRequestedMeasurementRow);
    }
  })();
  (function () {
    function openDrawingGatewayImageViewer(groupKey, index) {
      if (!window.GlobalImageViewer) return;
      var thumbs = Array.prototype.filter.call(
        document.querySelectorAll('[data-group-key][data-view-url]'),
        function (el) { return String(el.dataset.groupKey || '') === String(groupKey); }
      );
      var files = thumbs.map(function (el) {
        return {
          view_url: el.dataset.viewUrl || '',
          download_url: el.dataset.downloadUrl || '',
          filename: el.dataset.filename || '이미지',
          key: el.dataset.key || ''
        };
      }).filter(function (f) { return !!f.view_url; });
      if (!files.length) return;
      window.GlobalImageViewer.open(files, index || 0);
    }
    window.openDrawingGatewayImageViewer = openDrawingGatewayImageViewer;
  })();
  (function () {
    // 기간 필터 3개월 캡: date_from 선택 시 date_to의 max=+92일 설정, 초과 입력은 자동 보정.
    function clampMeasurementRange() {
      var fromInput = document.getElementById('measurement-date-from');
      var toInput = document.getElementById('measurement-date-to');
      if (!fromInput || !toInput) return;
      var maxDays = parseInt(fromInput.getAttribute('data-range-max-days') || '92', 10);
      function applyMax() {
        if (!fromInput.value) { toInput.removeAttribute('max'); return; }
        var start = new Date(fromInput.value + 'T00:00:00');
        if (isNaN(start.getTime())) return;
        start.setDate(start.getDate() + maxDays);
        var maxStr = start.getFullYear() + '-'
          + String(start.getMonth() + 1).padStart(2, '0') + '-'
          + String(start.getDate()).padStart(2, '0');
        toInput.setAttribute('max', maxStr);
        if (toInput.value && toInput.value > maxStr) { toInput.value = maxStr; }
      }
      // 폼 요소 직접 바인딩(프래그먼트 스왑마다 새 DOM → 중복 리스너 없음). 동일 요소 재바인딩만 가드.
      if (fromInput.dataset.rangeCapBound !== '1') {
        fromInput.dataset.rangeCapBound = '1';
        fromInput.addEventListener('change', applyMax);
      }
      applyMax();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', clampMeasurementRange);
    } else {
      clampMeasurementRange();
    }
    if (!window.__fomsMeasurementRangeCapBound) {
      window.__fomsMeasurementRangeCapBound = true;
      document.addEventListener('foms:erp-shell-fragment-swapped', clampMeasurementRange);
    }
  })();
</script>
