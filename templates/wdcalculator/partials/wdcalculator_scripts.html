<script>
(function () {
function onWdCalculatorDomReady(callback) {
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", callback, { once: true });
        return;
    }
    callback();
}

function bootWdCalculatorHost() {
    const DEFAULT_COUPON_VALUE = 11000; // 기본 쿠폰 금액

    // shared helpers loaded from static/js/wdcalculator/shared.js

    const {
        getEstimates,
        getEstimatesLength,
        setEstimates,
    } = WdCalculatorEstimatesState;
    WdCalculatorEstimatesEarlyHostBootstrap.configure({
        estimatesEarlyBootstrap: WdCalculatorEstimatesEarlyBootstrap,
        estimatesState: WdCalculatorEstimatesState,
        earlyBootstrap: WdCalculatorEarlyBootstrap,
        unsavedExitGuard: WdCalculatorUnsavedExitGuard,
        layoutSyncWiring: WdCalculatorLayoutSyncWiring,
        initialEstimates: [],
        getEstimates,
        windowRef: window,
        requestLayoutSync: requestWdCalculatorLayoutSync,
    });
    WdCalculatorEstimatesEarlyHostBootstrap.initEstimatesEarlyHostBootstrap();

    const {
        calculateEstimate,
        collectCurrentEstimate,
    } = WdCalculatorCurrentEstimateOrchestration;
    const {
        getProducts,
        setProducts,
    } = WdCalculatorProductsState;
    const {
        getEditingEstimateId,
        setEditingEstimateId,
    } = WdCalculatorEditingEstimateId;
    WdCalculatorProductsEditingHostBootstrap.configure({
        productsEditingBootstrap: WdCalculatorProductsEditingBootstrap,
        productsState: WdCalculatorProductsState,
        editingEstimateIdState: WdCalculatorEditingEstimateId,
        initialProducts: [],
        initialEditingEstimateId: null,
    });
    WdCalculatorProductsEditingHostBootstrap.initProductsEditingHostBootstrap();

    // 복합 기본견적(Base Components): static/js/wdcalculator/primary-form.js (base-components band)
    WdCalculatorPrimaryUiBootstrap.configure({
        baseComponentsUi: WdCalculatorBaseComponentsUI,
        couponDisplayHelpers: WdCalculatorCouponDisplayHelpers,
        additionalOptionsUi: WdCalculatorAdditionalOptionsUI,
        getProducts,
        getCalculateEstimate: () => calculateEstimate,
        defaultCouponValue: DEFAULT_COUPON_VALUE,
        getCategories: () => wdCalculatorCategories,
    });
    const {
        getProductsOptionsHtml,
        renderBaseComponentRow,
        ensureBaseComponentsUI,
        readBaseComponentsFromUI,
        updateBaseProductSelectOptions,
        initBaseComponentsLiveInteractions,
        getCouponValue,
        applyFinalPriceStyle,
        applyCouponDiscountStyle,
        appendAdditionalOptionRow,
        loadAdditionalOptionRows,
        readAdditionalOptionRowsFromUI,
    } = WdCalculatorPrimaryUiBootstrap.initPrimaryUiBootstrap();
    const { collectNotes } = WdCalculatorNotesUI;
    const { initAddOptionButton } = WdCalculatorAddOptionButton;
    const { initCalculateButton } = WdCalculatorCalculateButton;
    const { calculateTotalEstimates } = WdCalculatorTotalEstimatesDisplay;
    const { loadEstimateToForm: loadSavedEstimateToForm } = WdCalculatorLoadSavedEstimateToForm;
    const {
        resolveCurrentEstimateMath: resolveWdcCurrentEstimateMath,
        resolveAggregateTotals: resolveWdcAggregateTotals,
    } = WdCalculatorCalculationResolvers;
    WdCalculatorCurrentEstimateOrchestration.configure({
        getProducts,
        getEditingEstimateId,
        getEstimates,
        readBaseComponentsFromUI,
        readAdditionalOptionRowsFromUI,
        resolveCurrentEstimateMath: resolveWdcCurrentEstimateMath,
        getCouponValue,
        formatNumber,
        applyFinalPriceStyle,
        applyCouponDiscountStyle,
        collectNotes,
        documentRef: document,
        alertImpl: alert,
        consoleRef: console,
    });
    WdCalculatorCatalogButtonsHostBootstrap.configure({
        catalogButtonsBootstrap: WdCalculatorCatalogButtonsBootstrap,
        addOptionButton: WdCalculatorAddOptionButton,
        calculateButton: WdCalculatorCalculateButton,
        productCatalogUi: WdCalculatorProductCatalogUI,
        documentRef: document,
        appendAdditionalOptionRow,
        calculateEstimate,
        getProducts,
        setProducts,
        getCalculateEstimate: () => calculateEstimate,
        updateBaseProductSelectOptions,
        ensureBaseComponentsUI,
    });
    WdCalculatorCatalogButtonsHostBootstrap.initCatalogButtonsHostBootstrap();
    WdCalculatorCouponSearchRenderHostBootstrap.configure({
        couponSearchRenderBootstrap: WdCalculatorCouponSearchRenderBootstrap,
        couponShippingWiring: WdCalculatorCouponShippingWiring,
        searchResultsLoad: WdCalculatorSearchResultsLoad,
        renderEstimatesList: WdCalculatorRenderEstimatesList,
        defaultCouponValue: DEFAULT_COUPON_VALUE,
        getEstimates,
        calculateEstimate,
        calculateTotalEstimates,
        getCouponValue,
        formatNumber,
        loadEstimateToForm: loadSavedEstimateToForm,
        escapeHtml,
        formatNotesText: WdCalculatorNotesUI.formatNotesText,
        onRenderComplete: calculateTotalEstimates,
        getProducts,
    });
    WdCalculatorCouponSearchRenderHostBootstrap.initCouponSearchRenderHostBootstrap();
    const {
        loadProducts,
        updateProductSelect,
        showProductInfo,
        bindProductSelect,
    } = WdCalculatorProductCatalogUI;
    const { initSearchResultsLoadBridge } = WdCalculatorSearchResultsLoad;
    const { renderEstimatesList } = WdCalculatorRenderEstimatesList;
    const {
        resetInputFormKeepCustomerName,
        resetInputFormToNewEstimate,
    } = WdCalculatorResetInputFormKeepCustomer;
    const { loadEstimateToInputForm } = WdCalculatorLoadEstimateToInputForm;
    const { refreshAfterSave } = WdCalculatorRefreshAfterSave;
    const { bindOrderMatchButtons } = WdCalculatorOrderMatchUI;
    const { initCouponShippingWiring } = WdCalculatorCouponShippingWiring;
    const {
        loadInitialProducts,
        renderInitialBaseComponentsUi,
    } = WdCalculatorTerminalInit;
    const {
        getLoadingState,
        setLoadingState,
    } = WdCalculatorLoadingState;
    const {
        getCurrentDatabaseEstimateId,
        setCurrentDatabaseEstimateId,
    } = WdCalculatorCurrentDatabaseEstimateId;
    WdCalculatorLoadingDatabaseHostBootstrap.configure({
        loadingDatabaseBootstrap: WdCalculatorLoadingDatabaseBootstrap,
        loadingState: WdCalculatorLoadingState,
        currentDatabaseEstimateIdState: WdCalculatorCurrentDatabaseEstimateId,
        initialLoadingValue: false,
        initialCurrentDatabaseEstimateId: null,
    });
    WdCalculatorLoadingDatabaseHostBootstrap.initLoadingDatabaseHostBootstrap();

    WdCalculatorTotalsStartupTerminalHostBootstrap.configure({
        totalsStartupTerminalBootstrap: WdCalculatorTotalsStartupTerminalBootstrap,
        totalEstimatesDisplay: WdCalculatorTotalEstimatesDisplay,
        startupInit: WdCalculatorStartupInit,
        terminalInit: WdCalculatorTerminalInit,
        getEstimates,
        getEditingEstimateId,
        getCouponValue,
        resolveAggregateTotals: resolveWdcAggregateTotals,
        collectNotes,
        formatNumber,
        applyFinalPriceStyle,
        applyCouponDiscountStyle,
        documentRef: document,
        alertImpl: alert,
        consoleRef: console,
        categories: wdCalculatorCategories,
        bindProductSelect,
        initBaseComponentsLiveInteractions,
        initAddOptionButton,
        initCalculateButton,
        initSearchResultsLoadBridge,
        bindOrderMatchButtons,
        initCouponShippingWiring,
        loadProducts,
        ensureBaseComponentsUI,
    });
    WdCalculatorTotalsStartupTerminalHostBootstrap.initTotalsStartupTerminalHostBootstrap();
    
    // 비고 UI는 static/js/wdcalculator/primary-form.js (notes band, WdCalculatorNotesUI)
    WdCalculatorNotesUiHostBootstrap.configure({
        notesUiBootstrap: WdCalculatorNotesUiBootstrap,
        notesUi: WdCalculatorNotesUI,
    });
    WdCalculatorNotesUiHostBootstrap.initNotesUiHostBootstrap();
    
    // (구버전) 단일 가로넓이 입력(widthInput)은 복합 기본구성 도입으로 제거됨
    
    // 초기 제품 목록 로드
    loadInitialProducts();
    WdCalculatorEstimateMutationBridge.configure({
        resetFormModule: WdCalculatorResetInputFormKeepCustomer,
        loadInputModule: WdCalculatorLoadEstimateToInputForm,
        loadSavedModule: WdCalculatorLoadSavedEstimateToForm,
        addEstimateModule: WdCalculatorAddEstimate,
        listEventsModule: WdCalculatorEstimateListEvents,
        saveEstimateModule: WdCalculatorSaveEstimate,
        setEditingEstimateId,
        getEstimatesLength,
        ensureBaseComponentsUI,
        resetNotesToEmpty: () => WdCalculatorNotesUI.resetNotesToEmpty(),
        recalculate: () => {
            calculateEstimate();
            calculateTotalEstimates();
        },
        setLoadingState,
        getEditingEstimateId,
        getEstimates,
        normalizeId,
        isSameId,
        loadAdditionalOptionRows,
        loadNotes: WdCalculatorNotesUI.loadNotes,
        calculateEstimate,
        setCurrentDatabaseEstimateId,
        setEstimates,
        generateEstimateId,
        formatNumber,
        renderEstimatesList,
        reloadImpl: () => location.reload(),
        collectCurrentEstimate,
        resetInputFormKeepCustomerName,
        resetInputFormToNewEstimate,
        getLoadingState,
        loadEstimateToInputForm,
        setTimeoutImpl: setTimeout,
        getCurrentDatabaseEstimateId,
        collectNotes,
        getCouponValue,
        resolveAggregateTotals: resolveWdcAggregateTotals,
        refreshAfterSave,
        documentRef: document,
        confirmImpl: confirm,
        alertImpl: alert,
        consoleRef: console,
        fetchImpl: fetch,
    });
    WdCalculatorEstimateMutationBridge.initEstimateMutationBridge();
    WdCalculatorPostMutationUiHostBootstrap.configure({
        postMutationUiBootstrap: WdCalculatorPostMutationUiBootstrap,
        lateBootstrap: WdCalculatorLateBootstrap,
        sidebarBootstrap: WdCalculatorSidebarBootstrap,
        refreshAfterSave: WdCalculatorRefreshAfterSave,
        urlBootstrap: WdCalculatorUrlBootstrap,
        initSidebarEstimates: window.initWdCalculatorSidebarEstimates,
        loadEstimateToForm: loadSavedEstimateToForm,
        formatNumber,
        setEstimates,
        resetInputFormKeepCustomerName,
        resetInputFormToNewEstimate,
        renderEstimatesList,
        getProducts,
        documentRef: document,
        consoleRef: console,
        setTimeoutImpl: setTimeout,
        renderInitialBaseComponentsUi,
    });
    WdCalculatorPostMutationUiHostBootstrap.initPostMutationUiHostBootstrap();

    (function initWdCalculatorUnitPriceMetaToggle() {
        var up = window.WdCalculatorUnitPriceMeta;
        var toggle = document.getElementById("wdUnitPriceMetaToggle");
        if (!up || !toggle || typeof up.isUnitPriceMetaVisible !== "function") {
            return;
        }
        toggle.checked = up.isUnitPriceMetaVisible();
        toggle.addEventListener("change", function () {
            up.setUnitPriceMetaVisible(!!toggle.checked);
            renderEstimatesList();
            if (typeof window.loadSidebarEstimates === "function") {
                window.loadSidebarEstimates();
            }
        });
    })();

}

if (window.WdCalculatorEntry && typeof window.WdCalculatorEntry.ready === "function") {
    window.WdCalculatorEntry.ready(function (error) {
        if (error) return;
        onWdCalculatorDomReady(bootWdCalculatorHost);
    });
} else {
    onWdCalculatorDomReady(bootWdCalculatorHost);
}
})();
</script>
