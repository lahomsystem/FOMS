{# AS 모바일 무한스크롤 조각 — 백엔드 mobile_chunk=1 응답 전용.
   JS는 이 div의 innerHTML(카드들)만 .erp-pro-order-cards에 append하므로 카드가 flex 직접자식이 되어 gap 보존. #}
<div data-foms-mobile-queue-chunk
     data-next-page="{{ page + 1 if page < total_pages else 0 }}"
     data-total-pages="{{ total_pages }}"
     data-page-label="{{ [page * per_page, total_orders] | min }} / 전체 {{ total_orders }}건">
  {% for r in rows %}
    {% include 'cs/partials/as_mobile_order_card.html' %}
  {% endfor %}
</div>
