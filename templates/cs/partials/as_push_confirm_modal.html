<!-- AS PUSH 전송 확인 (AS-FRESH-01 T7 / AS-BIND-01) — 나갈 본문과 파일을 눈으로 확인하고 고른다.
     기본 선택은 서버(select_as_push_attachments)가 정하고, 여기서는 되살리기/빼기·순서만 한다. -->
<div class="modal fade" id="asPushConfirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-fullscreen-md-down">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-paper-plane"></i> AS방으로 전송</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
      </div>
      <div class="modal-body">
        <div class="as-push-confirm__label">보낼 내용</div>
        <pre class="as-push-confirm__text" id="as-push-confirm-text"></pre>
        <div class="as-push-confirm__label">
          보낼 파일 (드래그/▲▼로 순서) <span class="as-push-confirm__count" id="as-push-confirm-count"></span>
        </div>
        <p class="as-push-confirm__hint" id="as-push-confirm-cap-hint" hidden>앞 20장만 채널톡에 첨부됩니다.</p>
        <div class="as-push-confirm__selected" id="as-push-confirm-selected"></div>
        <div class="as-push-confirm__label">후보</div>
        <div class="as-push-confirm__files" id="as-push-confirm-files"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="as-push-confirm-send">
          <i class="fas fa-paper-plane"></i> 전송
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
      </div>
    </div>
  </div>
</div>
