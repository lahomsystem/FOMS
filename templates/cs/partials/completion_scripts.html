<script>
  (function () {
    function escapeHtml(s) {
      if (s == null || s === '') return '';
      var t = String(s);
      return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeAttr(s) {
      if (s == null || s === '') return '';
      return escapeHtml(s).replace(/'/g, '&#39;');
    }

    function buildStatusLabel(status) {
      if (status === 'COMPLETED') return '완료';
      if (status === 'AS_RECEIVED') return 'AS 접수';
      if (status === 'AS_COMPLETED') return 'AS 완료';
      return escapeHtml(status || '-');
    }

    function buildGallery(orderId, photos, emptyHtml) {
      if (!photos.length) {
        return emptyHtml;
      }

      var galleryHtml = '<div class="erp-completion-gallery">';
      var imageIndex = 0;
      photos.forEach(function (photo) {
        var isVideo = (photo.file_type || '').toLowerCase().indexOf('video') !== -1;
        if (isVideo) {
          galleryHtml += '<div class="erp-completion-media erp-completion-media--video" data-order-id="' + orderId + '" data-photo-index="' + imageIndex + '" title="동영상 재생" role="button" tabindex="0"><span class="erp-completion-media__icon"><i class="fas fa-video"></i></span><span class="erp-completion-media__label">동영상</span><span class="erp-completion-media__play"><i class="fas fa-play"></i></span></div>';
        } else {
          galleryHtml += '<img src="' + escapeAttr(photo.view_url || '#') + '" alt="' + escapeAttr(photo.filename || '') + '" data-order-id="' + orderId + '" data-photo-index="' + imageIndex + '" loading="lazy">';
        }
        imageIndex += 1;
      });
      galleryHtml += '</div>';
      return galleryHtml;
    }

    function buildDesktopRow(order, galleryHtml, resultLabel, orderDetailHref, hideOrderActions) {
      var safeManager = escapeHtml(order.manager_name || '-');
      var safeCustomer = escapeHtml(order.customer_name || '-');
      var safeProduct = escapeHtml(order.product_summary || '-');
      var selfMeasBadge = order.is_self_measurement
        ? ' <span class="badge bg-info text-white ms-1" title="자가 실측"><i class="fas fa-ruler-combined"></i> 자가 실측</span>'
        : '';
      var noteHtml = '';
      if (order.completion_note && String(order.completion_note).trim()) {
        noteHtml = '<div class="erp-completion-note text-muted small mt-2"><i class="fas fa-comment-dots"></i> ' + escapeHtml(String(order.completion_note).trim()) + '</div>';
      }

      var orderIdHtml = hideOrderActions
        ? '<span class="fw-bold">#' + order.id + '</span>'
        : '<a href="' + escapeAttr(orderDetailHref) + '" class="fw-bold text-decoration-none" title="주문 상세">#' + order.id + '</a>';
      var settlementBtnHtml = hideOrderActions
        ? ''
        : ' <button type="button" class="btn btn-sm btn-outline-warning" data-action="open-settlement-modal" data-order-id="' + order.id + '" title="비용 청구"><i class="fas fa-file-invoice-dollar"></i><span class="d-none d-md-inline ms-1">비용 청구</span></button>';

      var html = '<div class="erp-completion-row erp-completion-row--desktop" data-order-id="' + order.id + '">';
      html += '<div class="erp-completion-summary d-flex flex-wrap align-items-center gap-2">' + orderIdHtml;
      html += '<span>' + escapeHtml(order.construction_date || '-') + '</span> | <span>' + safeManager + '</span> | <span>' + safeCustomer + selfMeasBadge + '</span> | <span class="text-truncate" style="max-width:180px">' + safeProduct + '</span> | <span class="badge bg-secondary">' + resultLabel + '</span>';
      html += settlementBtnHtml + '</div>';
      html += galleryHtml;
      html += noteHtml;
      html += '</div>';
      return html;
    }

    function buildMobileCard(order, galleryHtml, resultLabel, orderDetailHref, hideOrderActions) {
      var safeManager = escapeHtml(order.manager_name || '-');
      var safeCustomer = escapeHtml(order.customer_name || '-');
      var safeProduct = escapeHtml(order.product_summary || '-');
      var noteHtml = '';
      var asContentHtml = '';
      var failHistoryHtml = '';
      var selfMeasBadge = order.is_self_measurement
        ? '<span class="badge bg-info text-white"><i class="fas fa-ruler-combined"></i> 자가 실측</span>'
        : '';

      if (order.as_content && String(order.as_content).trim()) {
        asContentHtml = '<div class="erp-completion-mobile-card__note"><strong>AS 접수 내용</strong><span>' + escapeHtml(String(order.as_content).trim()) + '</span></div>';
      }
      if (order.completion_note && String(order.completion_note).trim()) {
        noteHtml = '<div class="erp-completion-mobile-card__note"><strong>완료 메모</strong><span>' + escapeHtml(String(order.completion_note).trim()) + '</span></div>';
      }
      if (order.construction_fail_history && order.construction_fail_history.length) {
        failHistoryHtml = '<div class="erp-completion-mobile-card__note"><strong>재시공 이력</strong><span>' + order.construction_fail_history.length + '건</span></div>';
      }

      var orderLinkHtml = hideOrderActions
        ? '<span class="erp-completion-mobile-card__order-link">#' + order.id + '</span>'
        : '<a class="erp-completion-mobile-card__order-link" href="' + escapeAttr(orderDetailHref) + '">#' + order.id + '</a>';

      var html = '<article class="erp-completion-mobile-card" data-order-id="' + order.id + '">';
      html += '<div class="erp-completion-mobile-card__topline"><span class="erp-completion-mobile-card__status">' + resultLabel + '</span>' + orderLinkHtml + '</div>';
      html += '<div class="erp-completion-mobile-card__title-row"><h3 class="erp-completion-mobile-card__customer">' + safeCustomer + '</h3>' + selfMeasBadge + '</div>';
      html += '<dl class="erp-completion-mobile-card__meta">';
      html += '<div class="erp-completion-mobile-card__meta-row"><dt>시공일</dt><dd>' + escapeHtml(order.construction_date || '-') + '</dd></div>';
      html += '<div class="erp-completion-mobile-card__meta-row"><dt>담당</dt><dd>' + safeManager + '</dd></div>';
      html += '<div class="erp-completion-mobile-card__meta-row"><dt>품목</dt><dd>' + safeProduct + '</dd></div>';
      html += '</dl>';
      html += galleryHtml;
      html += asContentHtml;
      html += noteHtml;
      html += failHistoryHtml;
      if (!hideOrderActions) {
        html += '<div class="erp-completion-mobile-card__actions">';
        html += '<a class="erp-completion-mobile-card__action" href="' + escapeAttr(orderDetailHref) + '"><i class="fas fa-up-right-from-square"></i><span>주문 상세</span></a>';
        html += '<button type="button" class="erp-completion-mobile-card__action is-primary" data-action="open-settlement-modal" data-order-id="' + order.id + '"><i class="fas fa-file-invoice-dollar"></i><span>비용 청구</span></button>';
        html += '</div>';
      }
      html += '</article>';
      return html;
    }

    var listEl = document.getElementById('erp-completion-list');
    if (!listEl) return;

    var rootEl = listEl.closest('.erp-completion');
    var isMobileV2 = !!(rootEl && rootEl.dataset.erpMobileV2 === 'true');
    var isConstructionTeam = !!(rootEl && rootEl.dataset.isConstructionTeam === 'true');
    var hideOrderActions = isConstructionTeam;
    var pageParams = new URLSearchParams(window.location.search);
    var apiParams = new URLSearchParams();
    var datasetSearchQ = rootEl ? String(rootEl.dataset.searchQ || '').trim() : '';
    var datasetFocusOrder = rootEl ? String(rootEl.dataset.focusOrder || '').trim() : '';
    var searchQ = datasetSearchQ || (pageParams.get('q') || pageParams.get('search') || '').trim();
    var focusOrderParam = datasetFocusOrder || (pageParams.get('focus_order') || '').trim();
    var mineParam = (pageParams.get('mine') || '').trim();
    if (searchQ) apiParams.set('q', searchQ);
    if (focusOrderParam) apiParams.set('focus_order', focusOrderParam);
    if (mineParam) apiParams.set('mine', mineParam);
    var completionApiUrl = '/api/orders/completion';
    var apiQuery = apiParams.toString();
    if (apiQuery) completionApiUrl += '?' + apiQuery;

    fetch(completionApiUrl, { credentials: 'same-origin' })
      .then(function (response) {
        if (!response.ok) {
          throw new Error('completion list HTTP ' + response.status);
        }
        return response.json();
      })
      .then(function (data) {
        if (!data.success || !Array.isArray(data.orders)) {
          listEl.innerHTML = '<div class="alert alert-warning">목록을 불러올 수 없습니다.</div>';
          return;
        }

        var orders = data.orders;
        if (!orders.length) {
          listEl.innerHTML = '<div class="text-center py-5 text-muted"><i class="far fa-folder-open fa-2x mb-2"></i><p class="mb-0">완료 및 AS 건이 없습니다.</p></div>';
          return;
        }

        var html = '';
        orders.forEach(function (order) {
          var resultLabel = buildStatusLabel(order.status);
          var desktopGalleryHtml = buildGallery(
            order.id,
            order.construction_photos || [],
            '<div class="text-muted small">시공 사진이 없습니다.</div>'
          );
          var mobileGalleryHtml = buildGallery(
            order.id,
            order.construction_photos || [],
            '<div class="erp-completion-mobile-card__empty">시공 사진이 없습니다.</div>'
          );
          var orderDetailHref = '/edit/' + order.id + '?open=erp-order';
          html += buildDesktopRow(order, desktopGalleryHtml, resultLabel, orderDetailHref, hideOrderActions);
          if (isMobileV2) {
            html += buildMobileCard(order, mobileGalleryHtml, resultLabel, orderDetailHref, hideOrderActions);
          }
        });
        listEl.innerHTML = html;

        (function highlightFocusedOrder() {
          var focusOrder = new URLSearchParams(window.location.search).get('focus_order');
          if (!focusOrder) return;

          window.setTimeout(function () {
            var card = listEl.querySelector('.erp-completion-mobile-card[data-order-id="' + focusOrder + '"]');
            var row = listEl.querySelector('.erp-completion-row[data-order-id="' + focusOrder + '"]');
            var focusTarget = card || row;
            if (!focusTarget) return;

            focusTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (card) {
              card.classList.add('is-focused');
              window.setTimeout(function () { card.classList.remove('is-focused'); }, 2500);
            }
            if (row) {
              row.classList.add('table-info');
              window.setTimeout(function () { row.classList.remove('table-info'); }, 2500);
            }
          }, 300);
        })();

        var modalEl = document.getElementById('erp-settlement-modal');
        var orderIdInput = document.getElementById('erp-settlement-order-id');
        var submitBtn = document.getElementById('erp-settlement-submit');
        var depSelect = document.getElementById('erp-settlement-department');
        var chargeToWrapper = document.getElementById('erp-settlement-charge-to-wrapper');
        var chargeToSelect = document.getElementById('erp-settlement-charge-to-user');
        var DEPTS_WITH_MEMBERS = ['SALES', 'DRAWING', 'PRODUCTION', 'CONSTRUCTION'];

        function resetChargeToUser() {
          if (chargeToSelect) {
            chargeToSelect.innerHTML = '<option value="">부서만</option>';
            chargeToSelect.value = '';
          }
          if (chargeToWrapper) chargeToWrapper.classList.add('d-none');
        }

        function loadTeamMembers(team, callback) {
          fetch('/erp/api/users?team=' + encodeURIComponent(team), { credentials: 'same-origin' })
            .then(function (response) { return response.json(); })
            .then(function (teamData) {
              if (chargeToSelect && teamData.success && Array.isArray(teamData.users)) {
                chargeToSelect.innerHTML = '<option value="">부서만</option>';
                teamData.users.forEach(function (user) {
                  var option = document.createElement('option');
                  option.value = String(user.id);
                  option.textContent = user.name || ('#' + user.id);
                  chargeToSelect.appendChild(option);
                });
              }
              if (callback) callback();
            })
            .catch(function () {
              if (chargeToSelect) chargeToSelect.innerHTML = '<option value="">부서만</option>';
              if (callback) callback();
            });
        }

        if (depSelect) {
          depSelect.addEventListener('change', function () {
            var department = (depSelect.value || '').trim();
            if (DEPTS_WITH_MEMBERS.indexOf(department) !== -1) {
              chargeToWrapper.classList.remove('d-none');
              loadTeamMembers(department);
            } else {
              resetChargeToUser();
            }
          });
        }

        if (modalEl && orderIdInput && submitBtn) {
          listEl.addEventListener('click', function (event) {
            var openBtn = event.target.closest('[data-action="open-settlement-modal"]');
            if (!openBtn) return;

            var orderId = openBtn.getAttribute('data-order-id');
            if (!orderId) return;

            orderIdInput.value = orderId;
            if (depSelect) depSelect.value = '';
            document.getElementById('erp-settlement-amount').value = '';
            document.getElementById('erp-settlement-reason').value = '';
            resetChargeToUser();
            if (window.bootstrap && window.bootstrap.Modal) {
              var modalInstance = window.bootstrap.Modal.getOrCreateInstance
                ? window.bootstrap.Modal.getOrCreateInstance(modalEl)
                : new window.bootstrap.Modal(modalEl);
              modalInstance.show();
            }
          });

          submitBtn.addEventListener('click', function () {
            var orderId = orderIdInput.value;
            var department = depSelect ? depSelect.value : '';
            var amount = document.getElementById('erp-settlement-amount').value;
            var reason = document.getElementById('erp-settlement-reason').value.trim();

            if (!orderId || !department || !amount || !reason) {
              alert('귀속 부서, 금액, 사유를 모두 입력해주세요.');
              return;
            }

            var payload = {
              department: department,
              amount: -Math.abs(parseInt(amount, 10) || 0),
              reason: reason
            };
            var chargeVal = chargeToSelect ? chargeToSelect.value : '';
            if (chargeVal && /^\d+$/.test(chargeVal)) {
              payload.charge_to_user_id = parseInt(chargeVal, 10);
            }

            submitBtn.disabled = true;
            fetch('/api/orders/' + orderId + '/settlement/issue', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            })
              .then(function (response) { return response.json(); })
              .then(function (result) {
                submitBtn.disabled = false;
                if (!result.success) {
                  alert(result.message || '등록에 실패했습니다.');
                  return;
                }

                if (window.bootstrap && modalEl) {
                  var modal = window.bootstrap.Modal.getInstance(modalEl);
                  if (modal) modal.hide();
                }
                alert('비용 청구가 등록되었습니다.');
                orderIdInput.value = '';
              })
              .catch(function (error) {
                submitBtn.disabled = false;
                console.error(error);
                alert('요청 중 오류가 발생했습니다.');
              });
          });
        }

        listEl.addEventListener('click', function (event) {
          var videoEl = event.target.closest('.erp-completion-media--video[data-order-id]');
          var imageEl = event.target.closest('img[data-order-id][data-photo-index]');
          var mediaEl = videoEl || imageEl;
          if (!mediaEl || typeof window.GlobalImageViewer === 'undefined' || !window.GlobalImageViewer.open) return;

          var orderId = parseInt(mediaEl.getAttribute('data-order-id'), 10);
          var photoIndex = parseInt(mediaEl.getAttribute('data-photo-index'), 10);
          var order = orders.find(function (item) { return item.id === orderId; });
          if (!order || !order.construction_photos || !order.construction_photos.length) return;

          var files = order.construction_photos.map(function (photo) {
            return { url: photo.view_url, filename: photo.filename, key: photo.storage_key };
          });
          window.GlobalImageViewer.open(files, photoIndex);

          var footer = document.getElementById('global-viewer-footer');
          if (!footer) return;

          var extra = document.getElementById('global-viewer-completion-extra');
          if (extra) extra.remove();

          var parts = [];
          if (order.as_content) parts.push('AS: ' + order.as_content);
          if (order.completion_note) parts.push(order.completion_note);
          if (order.construction_fail_history && order.construction_fail_history.length) {
            parts.push('재시공 이력: ' + order.construction_fail_history.length + '건');
          }

          if (!parts.length) return;
          extra = document.createElement('div');
          extra.id = 'global-viewer-completion-extra';
          extra.className = 'global-viewer-completion-extra small text-muted mt-1';
          extra.textContent = parts.join(' | ');
          footer.appendChild(extra);
        });

        listEl.addEventListener('keydown', function (event) {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          var videoEl = event.target.closest('.erp-completion-media--video[data-order-id]');
          if (!videoEl) return;
          event.preventDefault();
          videoEl.click();
        });
      })
      .catch(function (error) {
        console.error('Completion list load error:', error);
        listEl.innerHTML = '<div class="alert alert-danger">목록을 불러오는 중 오류가 발생했습니다.</div>';
      });
  })();
</script>
