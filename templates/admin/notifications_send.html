{% extends "admin/layout.html" %}

{% block content %}
<div class="row">
  <div class="col-lg-8 mx-auto">
    <div class="card shadow-sm">
      <div class="card-header d-flex align-items-center gap-2">
        <i class="fas fa-bullhorn text-primary"></i>
        <h5 class="mb-0">공지/알림 발송</h5>
      </div>
      <div class="card-body">
        <form id="notifSendForm" autocomplete="off">
          <!-- 제목 -->
          <div class="mb-3">
            <label for="noti-title" class="form-label fw-semibold">제목 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="noti-title" maxlength="200" required placeholder="알림 제목을 입력하세요">
          </div>

          <!-- 내용 -->
          <div class="mb-3">
            <label for="noti-message" class="form-label fw-semibold">내용</label>
            <textarea class="form-control" id="noti-message" rows="4" placeholder="알림 내용 (선택사항)"></textarea>
          </div>

          <!-- 대상 유형 -->
          <div class="mb-3">
            <label class="form-label fw-semibold">대상 <span class="text-danger">*</span></label>
            <div class="d-flex gap-3 flex-wrap">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="target_type" id="tt-all" value="ALL" checked>
                <label class="form-check-label" for="tt-all">전체</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="target_type" id="tt-team" value="TEAM">
                <label class="form-check-label" for="tt-team">특정 팀</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="target_type" id="tt-user" value="USER">
                <label class="form-check-label" for="tt-user">특정 사용자</label>
              </div>
            </div>
          </div>

          <!-- 팀 선택 (TEAM일 때) -->
          <div class="mb-3 d-none" id="team-select-wrap">
            <label for="noti-team" class="form-label fw-semibold">팀 선택</label>
            <select class="form-select" id="noti-team">
              <option value="">-- 팀 선택 --</option>
              <option value="CS">CS (라홈)</option>
              <option value="HAUDD">HAUDD (하우드)</option>
              <option value="SALES">영업</option>
              <option value="DRAWING">도면</option>
              <option value="CONSTRUCTION">시공</option>
              <option value="PRODUCTION">생산</option>
            </select>
          </div>

          <!-- 사용자 선택 (USER일 때) -->
          <div class="mb-3 d-none" id="user-select-wrap">
            <label for="noti-users" class="form-label fw-semibold">사용자 선택 <small class="text-muted">(여러 명 선택 가능)</small></label>
            <select class="form-select" id="noti-users" multiple size="6">
            </select>
            <small class="text-muted">Ctrl+클릭으로 다중 선택</small>
          </div>

          <!-- 긴급 여부 -->
          <div class="mb-4">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="noti-urgent">
              <label class="form-check-label fw-semibold" for="noti-urgent">
                <i class="fas fa-exclamation-triangle text-danger"></i> 긴급 알림
              </label>
              <div class="form-text">긴급 체크 시 수신자에게 경고음 + 시각 이펙트가 표시됩니다.</div>
            </div>
          </div>

          <!-- 발송 버튼 -->
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg" id="send-btn">
              <i class="fas fa-paper-plane me-1"></i> 알림 발송
            </button>
          </div>
        </form>

        <!-- 결과 -->
        <div id="send-result" class="mt-3 d-none"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const form = document.getElementById('notifSendForm');
  const teamWrap = document.getElementById('team-select-wrap');
  const userWrap = document.getElementById('user-select-wrap');
  const userSelect = document.getElementById('noti-users');
  const resultDiv = document.getElementById('send-result');
  const sendBtn = document.getElementById('send-btn');
  let usersLoaded = false;

  document.querySelectorAll('input[name="target_type"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
      var v = this.value;
      teamWrap.classList.toggle('d-none', v !== 'TEAM');
      userWrap.classList.toggle('d-none', v !== 'USER');
      if (v === 'USER' && !usersLoaded) loadUsers();
    });
  });

  function loadUsers() {
    fetch('/admin/api/users')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.success) return;
        userSelect.innerHTML = '';
        data.users.forEach(function(u) {
          var opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = u.name + (u.team ? ' (' + u.team + ')' : '') + (u.role === 'ADMIN' ? ' [관리자]' : '');
          userSelect.appendChild(opt);
        });
        usersLoaded = true;
      })
      .catch(function() {});
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s || ''));
    return d.innerHTML;
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var title = document.getElementById('noti-title').value.trim();
    var message = document.getElementById('noti-message').value.trim();
    var isUrgent = document.getElementById('noti-urgent').checked;
    var targetType = document.querySelector('input[name="target_type"]:checked').value;
    var targetTeam = document.getElementById('noti-team').value;
    var selectedUsers = Array.from(userSelect.selectedOptions).map(function(o) { return parseInt(o.value); });

    if (!title) { alert('제목을 입력해주세요.'); return; }
    if (targetType === 'TEAM' && !targetTeam) { alert('팀을 선택해주세요.'); return; }
    if (targetType === 'USER' && selectedUsers.length === 0) { alert('사용자를 선택해주세요.'); return; }

    sendBtn.disabled = true;
    sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> 발송 중...';
    resultDiv.classList.add('d-none');

    window.FOMSNotificationWrite.fetch('/erp/api/notifications/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        title: title,
        message: message,
        is_urgent: isUrgent,
        target_type: targetType,
        target_team: targetTeam || null,
        target_user_ids: selectedUsers.length > 0 ? selectedUsers : null,
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      resultDiv.classList.remove('d-none');
      if (data.success) {
        resultDiv.className = 'mt-3 alert alert-success';
        resultDiv.innerHTML = '<i class="fas fa-check-circle me-1"></i> ' + escapeHtml(data.message);
        form.reset();
        teamWrap.classList.add('d-none');
        userWrap.classList.add('d-none');
      } else {
        resultDiv.className = 'mt-3 alert alert-danger';
        resultDiv.innerHTML = '<i class="fas fa-times-circle me-1"></i> ' + escapeHtml(data.message);
      }
    })
    .catch(function(err) {
      resultDiv.classList.remove('d-none');
      resultDiv.className = 'mt-3 alert alert-danger';
      resultDiv.innerHTML = '발송 중 오류가 발생했습니다.';
    })
    .finally(function() {
      sendBtn.disabled = false;
      sendBtn.innerHTML = '<i class="fas fa-paper-plane me-1"></i> 알림 발송';
    });
  });
})();
</script>
{% endblock %}
