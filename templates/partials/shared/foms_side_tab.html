{# P1-05 side tab rail (tablet split-view) #}
<nav class="foms-split-side-tab" aria-label="ERP 단계">
  {% for item in side_items | default([]) %}
  <a
    class="foms-split-side-tab__item{% if item.active %} is-active{% endif %}"
    href="{{ item.href }}"
    title="{{ item.label }}"
  >
    <i class="{{ item.icon }}" aria-hidden="true"></i>
    <span>{{ item.label }}</span>
  </a>
  {% endfor %}
</nav>
