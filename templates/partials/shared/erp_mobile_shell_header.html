<header class="erp-mobile-shell-header foms-shell-header" aria-label="ERP 모바일 셸">
  <div class="erp-mobile-shell-header__inner">
    {% if mobile_shell_show_back %}
    <button
      class="erp-mobile-shell-header__home foms-icon-btn"
      type="button"
      data-foms-shell-back
      {% if mobile_shell_back_href %}data-foms-shell-back-href="{{ mobile_shell_back_href }}"{% endif %}
      aria-label="뒤로 가기">
      <i class="fas fa-arrow-left" aria-hidden="true"></i>
    </button>
    {% else %}
    <button
      class="erp-mobile-shell-header__menu foms-icon-btn"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#erp-mobile-menu-drawer"
      aria-controls="erp-mobile-menu-drawer"
      aria-label="ERP 메뉴 열기">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
    {% endif %}
    <div class="erp-mobile-shell-header__context">
      <strong class="erp-mobile-shell-header__title foms-shell-title">{{ mobile_shell_title or (_current.item.label if _current.item else '홈') }}</strong>
    </div>
    {% if mobile_shell_show_mytasks %}
    <a
      class="erp-mobile-shell-header__mytasks foms-icon-btn{% if mobile_shell_mytasks_active %} is-active{% endif %}"
      href="{{ mobile_shell_mytasks_href }}"
      data-foms-mytasks-toggle
      aria-label="내 작업만 보기"
      aria-pressed="{{ 'true' if mobile_shell_mytasks_active else 'false' }}">
      <i class="fas fa-user-check" aria-hidden="true"></i>
    </a>
    {% endif %}
    <button
      class="erp-mobile-shell-header__search foms-icon-btn"
      type="button"
      data-foms-search-open
      aria-label="통합 검색">
      <i class="fas fa-search" aria-hidden="true"></i>
    </button>
    <a
      class="erp-mobile-shell-header__notify foms-icon-btn"
      href="{{ _home_href }}"
      aria-label="ERP 홈">
      <i class="fas fa-bell" aria-hidden="true"></i>
    </a>
  </div>
</header>
