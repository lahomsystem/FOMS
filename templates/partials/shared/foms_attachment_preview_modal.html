{# Compact attachment preview modal (mobile detail attach grid). Zoom CSS shared with ERP modal. #}
<div class="modal fade" id="fomsAttachmentPreviewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-paperclip" aria-hidden="true"></i> 첨부 미리보기</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
      </div>
      <div class="modal-body">
        <div id="foms-attachment-preview-body"></div>
      </div>
      <div class="modal-footer foms-attachment-preview-actions">
        <a
          class="btn btn-primary"
          id="foms-attachment-preview-download"
          href="#"
          target="_blank"
          rel="noopener"
          title="다운로드"
          aria-label="다운로드">
          <i class="fas fa-download" aria-hidden="true"></i>
        </a>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</div>
