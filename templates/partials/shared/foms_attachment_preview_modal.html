{# ERP 첨부 미리보기 — 모바일 ERP Order·시공 큐·주문 상세 공통 (zoom: attachment-preview-zoom.js) #}
<div class="modal fade foms-global-preview-modal" id="erpAttachmentPreviewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-paperclip" aria-hidden="true"></i> 첨부 미리보기</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
      </div>
      <div class="modal-body">
        <div id="erp-attachment-preview-body"></div>
      </div>
      <div class="modal-footer erp-attachment-preview-actions">
        <select class="foms-select d-none" id="erp-attachment-preview-item-select" aria-label="첨부 제품 연결"></select>
        <button type="button" class="btn btn-outline-secondary d-none" id="erp-attachment-preview-unlink"
          title="공통 첨부로 이동" aria-label="공통 첨부로 이동">
          <i class="fas fa-unlink" aria-hidden="true"></i>
        </button>
        <a class="btn btn-primary" id="erp-attachment-preview-download" href="#" target="_blank" rel="noopener"
          title="다운로드" aria-label="다운로드">
          <i class="fas fa-download" aria-hidden="true"></i>
        </a>
        <button type="button" class="btn btn-outline-danger d-none" id="erp-attachment-preview-delete"
          title="삭제" aria-label="삭제">
          <i class="fas fa-trash" aria-hidden="true"></i>
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</div>
