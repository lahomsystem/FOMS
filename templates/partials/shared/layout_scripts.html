    <!-- 전역 채팅 알림 팝업 컨테이너 (모든 페이지에서 사용) -->
    {% if current_user %}
    <div id="chat-notification-container" class="chat-notification-container"></div>
    {% endif %}

    <!-- 도면 뷰어 모달 (모든 페이지에서 사용) -->
    <div class="modal fade" id="blueprintViewerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content bg-dark">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-white">
                        <i class="fas fa-drafting-compass"></i> 도면 보기
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-3" id="blueprint-viewer-body"
                    style="overflow: auto; display: flex; align-items: center; justify-content: center; min-height: 400px;">
                    <img id="blueprint-viewer-img" src="" alt="도면"
                        style="max-width: 100%; max-height: calc(100vh - 200px); width: auto; height: auto; object-fit: contain; display: block; cursor: grab; user-select: none; transition: transform 0.1s;">
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" onclick="downloadBlueprint()"
                        id="blueprint-download-btn" style="display: none;">
                        <i class="fas fa-download"></i> 다운로드
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> 닫기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Global Immersive Image Viewer -->
    <div id="global-image-viewer" aria-hidden="true" style="display:none;">
        <div id="global-viewer-backdrop"></div>
        <a id="global-viewer-download" href="#" target="_blank" rel="noopener" title="다운로드" aria-label="다운로드"
            style="display:none;">
            <i class="fas fa-download"></i>
        </a>
        <button type="button" id="global-viewer-close" title="닫기" aria-label="닫기">
            <i class="fas fa-times"></i>
        </button>
        <button type="button" id="global-viewer-prev" class="global-viewer-nav" title="이전" aria-label="이전">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button type="button" id="global-viewer-next" class="global-viewer-nav" title="다음" aria-label="다음">
            <i class="fas fa-chevron-right"></i>
        </button>
        <div id="global-viewer-stage">
            <img id="global-viewer-image" src="" alt="" draggable="false" style="display:none;">
            <video id="global-viewer-video" src="" controls
                style="display:none; max-width:100%; max-height:100vh;"></video>
        </div>
        <!-- 파일명/카운터 제거. 비어 있으면 숨김(:empty). CS 완료 더블체크가 코멘트를 동적 주입. -->
        <div id="global-viewer-footer"></div>
    </div>

    <style>
        /* Global Notification Styles */
        @keyframes bell-shake {
            0% {
                transform: rotate(0);
            }

            15% {
                transform: rotate(15deg);
            }

            30% {
                transform: rotate(-15deg);
            }

            45% {
                transform: rotate(10deg);
            }

            60% {
                transform: rotate(-10deg);
            }

            75% {
                transform: rotate(5deg);
            }

            85% {
                transform: rotate(-5deg);
            }

            100% {
                transform: rotate(0);
            }
        }

        .bell-active {
            animation: bell-shake 2.5s infinite;
            color: #ffc107 !important;
            text-shadow: 0 0 10px rgba(255, 193, 7, 0.4);
        }

        .notification-item {
            transition: background-color 0.2s;
            cursor: pointer;
            border-left: 3px solid transparent;
        }

        .notification-item:hover {
            background-color: #f8f9fa;
        }

        .notification-item.unread {
            background-color: #f0f7ff;
            border-left-color: #0d6efd;
        }

        .notification-time {
            font-size: 0.75rem;
            color: #adb5bd;
        }

        /* Global Immersive Image Viewer Styles */
        #global-image-viewer {
            position: fixed;
            inset: 0;
            z-index: 10600;
            /* Higher than Bootstrap modal (1055) */
            display: none;
        }

        #global-image-viewer.d-flex {
            display: flex !important;
        }

        #global-viewer-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.22);
            backdrop-filter: blur(14px) saturate(120%);
            -webkit-backdrop-filter: blur(14px) saturate(120%);
        }

        #global-viewer-stage {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Viewer owns all touch gestures (pan/pinch/swipe); stop the browser's native
               page zoom/scroll from hijacking them so panning works while zoomed in. */
            touch-action: none;
        }

        #global-viewer-image {
            max-width: 95vw;
            max-height: 90vh;
            transform-origin: center center;
            touch-action: none;
            cursor: grab;
            user-select: none;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s linear;
        }

        .global-viewer-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            font-size: 24px;
        }

        .global-viewer-nav:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-50%) scale(1.1);
        }

        #global-viewer-prev {
            left: 24px;
        }

        #global-viewer-next {
            right: 24px;
        }

        #global-image-viewer:hover .global-viewer-nav,
        #global-image-viewer.nav-visible .global-viewer-nav {
            opacity: 1;
            pointer-events: auto;
        }

        #global-image-viewer.single-file .global-viewer-nav {
            display: none !important;
        }

        /* Mobile: swipe-first UX (hide arrow buttons) */
        @media (max-width: 768px) {
            .global-viewer-nav {
                display: none !important;
            }
        }

        #global-viewer-download {
            position: absolute;
            right: 84px;
            top: 24px;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            z-index: 3;
            font-size: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        #global-viewer-download:hover {
            background: rgba(255, 255, 255, 0.22);
            color: #fff;
        }

        #global-viewer-close {
            position: absolute;
            right: 24px;
            top: 24px;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            z-index: 3;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        #global-viewer-close:hover {
            background: rgba(255, 59, 48, 0.8);
            transform: rotate(90deg);
        }

        #global-viewer-footer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 24px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border-radius: 999px;
            padding: 10px 20px;
            font-size: 14px;
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 2;
            max-width: 90vw;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 파일명/카운터 제거 후 footer는 CS 코멘트가 주입될 때만 표시 */
        #global-viewer-footer:empty {
            display: none;
        }

        /* 모바일: 알림 패널 화면 최적화 (전체 표시, 겹침 방지) */
        @media (max-width: 768px) {
            .global-notification-panel {
                position: fixed !important;
                left: 0 !important;
                right: 0 !important;
                top: 52px !important;
                width: 100vw !important;
                max-width: 100vw !important;
                height: calc(100vh - 52px) !important;
                max-height: calc(100vh - 52px) !important;
                border-radius: 12px 12px 0 0 !important;
                box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
                display: flex !important;
                flex-direction: column !important;
                overflow: hidden !important;
            }

            .global-notification-panel[style*="display: none"] {
                display: none !important;
            }

            .global-notification-panel .p-3.border-bottom {
                padding: 0.75rem 1rem !important;
                flex-shrink: 0;
            }

            .global-notification-panel #global-notification-list {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            .global-notification-panel .notification-item {
                padding: 0.85rem 1rem !important;
                min-height: 52px;
            }

            .global-notification-panel .notification-item strong {
                max-width: none !important;
                white-space: normal !important;
                overflow: visible !important;
            }

            .global-notification-panel .notification-time {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 576px) {
            .global-notification-panel {
                top: 48px !important;
                height: calc(100vh - 48px) !important;
                max-height: calc(100vh - 48px) !important;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .bell-active {
                animation: none !important;
            }

            .notification-item,
            #global-viewer-image,
            .global-viewer-nav,
            #global-viewer-close {
                transition: none !important;
            }
        }
    </style>
