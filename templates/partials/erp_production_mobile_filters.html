<section class="erp-mobile-queue-filters" aria-label="생산 대시보드 모바일 필터">
  <form method="get" action="{{ url_for('erp_production_page.erp_production_dashboard') }}" class="erp-mobile-queue-filters__search">
    {% if erp_mine_only %}
      <input type="hidden" name="mine" value="1">
    {% endif %}
    {% if filters.get('stage') %}
      <input type="hidden" name="stage" value="{{ filters.get('stage') }}">
    {% endif %}
    <label class="visually-hidden" for="erp-production-mobile-search">검색</label>
    <input
      id="erp-production-mobile-search"
      type="text"
      class="erp-mobile-queue-filters__input"
      name="q"
      placeholder="고객, 연락처, 주소 검색"
      value="{{ filters.get('q') or '' }}">
    <button class="erp-mobile-queue-filters__submit" type="submit" aria-label="검색">
      <i class="fas fa-search" aria-hidden="true"></i>
    </button>
    <button
      class="erp-mobile-queue-filters__open"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#erp-production-mobile-filter-drawer"
      aria-controls="erp-production-mobile-filter-drawer">
      <i class="fas fa-sliders-h" aria-hidden="true"></i>
      <span>필터</span>
    </button>
  </form>

  <div
    class="offcanvas offcanvas-bottom erp-mobile-queue-filters__drawer"
    tabindex="-1"
    id="erp-production-mobile-filter-drawer"
    aria-labelledby="erp-production-mobile-filter-drawer-label">
    <div class="offcanvas-header">
      <div>
        <h2 class="offcanvas-title" id="erp-production-mobile-filter-drawer-label">생산 필터</h2>
        <p class="mb-0 small text-muted">시작 대기와 진행중 큐를 빠르게 좁힙니다.</p>
      </div>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="닫기"></button>
    </div>
    <div class="offcanvas-body">
      <form method="get" action="{{ url_for('erp_production_page.erp_production_dashboard') }}" class="erp-mobile-queue-filters__form">
        <div class="erp-mobile-queue-filters__field">
          <label for="erp-production-mobile-search-drawer">검색어</label>
          <input
            id="erp-production-mobile-search-drawer"
            type="text"
            name="q"
            class="form-control"
            value="{{ filters.get('q') or '' }}"
            placeholder="고객, 연락처, 주소">
        </div>
        <div class="erp-mobile-queue-filters__field">
          <label for="erp-production-mobile-stage">단계</label>
          <select id="erp-production-mobile-stage" class="form-select" name="stage">
            <option value="">전체</option>
            {% for step in process_steps %}
              <option value="{{ step.label }}" {% if filters.get('stage') == step.label %}selected{% endif %}>{{ step.display|default(step.label) }}</option>
            {% endfor %}
          </select>
        </div>
        <label class="erp-mobile-queue-filters__check">
          <input type="checkbox" name="mine" value="1" {% if erp_mine_only %}checked{% endif %}>
          <span>내 작업만 보기</span>
        </label>
        <div class="erp-mobile-queue-filters__actions">
          <a class="btn btn-outline-secondary" href="{{ url_for('erp_production_page.erp_production_dashboard') }}">초기화</a>
          <button class="btn btn-primary" type="submit">적용</button>
        </div>
      </form>
    </div>
  </div>
</section>
