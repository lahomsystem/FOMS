{# 아래 고정 줄 — 우리 화면의 저장 자리를 단계 버튼으로(§3.3). 버튼은 그 차례일 때만 그린다. #}
<div class="pp-actions" role="region" aria-label="단계 버튼">
    <p class="pp-status mb-0" id="ppStatus" role="status" aria-live="polite"></p>
    <div class="pp-actions__buttons">
        {% if view.items_editable %}
        <button type="button" class="btn btn-primary" data-pp-items-url="{{ url_for('partner_api.update_items', order_id=view.id) }}" data-pp-upload-url="{{ url_for('partner_api.upload_file', order_id=view.id) }}"><i class="fas fa-floppy-disk"></i> 품목 저장</button>
        {% endif %}
        {% if can_revise %}
        <button type="button" class="btn btn-outline-primary" data-pp-goto-tab="drawing">수정 요청 보내기</button>
        {% endif %}
        {% if can_approve %}
        <button type="button" class="btn btn-primary" data-pp-approve-url="{{ url_for('partner_api.approve_drawing', order_id=view.id) }}"><i class="fas fa-check"></i> 이대로 만들어 주세요</button>
        {% endif %}
        {% if can_as %}
        <button type="button" class="btn btn-outline-primary" data-pp-goto-tab="completion" data-pp-msheet-open="ppAsSheet">AS 접수</button>
        {% endif %}
        <a class="btn btn-outline-secondary" href="{{ url_for('partner_portal.home') }}">목록으로</a>
    </div>
</div>
