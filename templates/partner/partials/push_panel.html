{# 알림 받기(웹 푸시) 판 — PC 머리줄 · 휴대폰 위 줄 공용. partner-push.js 가 [data-pp-push] 마다 묶는다. #}
<div class="pp-push__panel" data-pp-push-panel hidden>
    <p class="pp-push__msg" data-pp-push-msg role="status" aria-live="polite"></p>
    <ol class="pp-push__steps" data-pp-push-steps hidden></ol>
    <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-sm btn-primary" data-pp-push-enable hidden>이 기기에서 알림 받기</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-pp-push-test hidden>시험 알림</button>
        <button type="button" class="btn btn-sm btn-outline-danger" data-pp-push-disable hidden>알림 끄기</button>
    </div>
</div>
