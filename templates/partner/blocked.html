<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>협력사 화면 준비 중</title>
    {# PARTNER-01: 공용 레이아웃(내부 메뉴·배지·알림 스크립트)을 쓰지 않는 단독 화면. #}
</head>
<body>
    <main>
        <h1>협력사 화면 준비 중</h1>
        <p>{{ partner_name }} 계정으로 로그인되어 있습니다.</p>
        <p>협력사 전용 화면이 열리면 이곳에서 주문을 등록하고 진행 상황을 볼 수 있습니다.</p>
        <form method="post" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit">로그아웃</button>
        </form>
    </main>
</body>
</html>
