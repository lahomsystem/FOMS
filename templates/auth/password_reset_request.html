{% extends "auth/layout.html" %}

{% block head %}
<title>비밀번호 재설정 요청 - 가구 주문 관리 시스템</title>
<style>
    body {
        background-color: #f8f9fa;
    }

    .reset-container {
        max-width: 450px;
        margin: 4rem auto;
        padding: 2rem;
        background-color: #fff;
        border-radius: 0.5rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
    }
</style>
{% endblock %}

{% block content %}
<div class="reset-container">
    <h2 class="text-center mb-4">비밀번호 재설정 요청</h2>
    <p class="text-center text-muted mb-4">
        아이디를 입력하면 관리자에게 재설정 요청이 전달됩니다.<br>
        관리자가 확인 후 새 비밀번호를 설정해 드립니다.
    </p>

    <form method="post">
        <div class="mb-3">
            <label for="username" class="form-label">사용자명 (ID) <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="username" name="username" required autocomplete="username"
                maxlength="64">
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">재설정 요청</button>
        </div>
    </form>
    <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a>
    </div>
</div>
{% endblock %}
