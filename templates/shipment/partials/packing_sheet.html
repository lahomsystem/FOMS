{# 출고 패킹 체크리스트 바텀시트 (B6). 로직은 static/js/shipment/foms-packing.js. #}
<div class="offcanvas offcanvas-bottom foms-packing-sheet" tabindex="-1" id="foms-packing-sheet"
     aria-labelledby="foms-packing-sheet-title" data-foms-packing-sheet>
  <div class="offcanvas-header">
    <div>
      <h5 class="offcanvas-title" id="foms-packing-sheet-title">출고 패킹</h5>
      <p class="mb-0 small text-muted" data-foms-packing-subtitle>제품별 패킹 항목을 체크하세요.</p>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="닫기"></button>
  </div>
  <div class="offcanvas-body">
    <div class="foms-packing-summary" data-foms-packing-summary>
      <span class="foms-packing-summary__count" data-foms-packing-count>0 / 0</span>
      <span class="foms-packing-summary__done" data-foms-packing-done hidden>전체 완료</span>
    </div>

    <div class="foms-packing-loading" data-foms-packing-loading hidden>불러오는 중...</div>
    <div class="alert alert-danger d-none foms-packing-error" data-foms-packing-error role="alert"></div>

    <ul class="foms-packing-list" data-foms-packing-list aria-label="패킹 체크리스트"></ul>

    <form class="foms-packing-add" data-foms-packing-add autocomplete="off">
      <input type="text" class="form-control foms-packing-add__label" name="label"
             placeholder="항목 추가 (예: 상판 유리)" aria-label="추가 항목 이름">
      <input type="number" class="form-control foms-packing-add__qty" name="qty"
             value="1" min="1" step="1" aria-label="수량">
      <button type="submit" class="foms-btn foms-btn--secondary foms-btn--sm foms-packing-add__btn">추가</button>
    </form>
  </div>
</div>
