<section class="foms-wizard__step is-active" data-wizard-step="1" aria-labelledby="wizard-step1-title">
  <h2 class="foms-wizard__title" id="wizard-step1-title">기본 정보</h2>
  <p class="foms-wizard__subtitle">고객님의 기본 정보를 입력해주세요</p>

  <div class="foms-wizard__field">
    <label class="field__label foms-wizard__label--required" for="wiz-customer-name">고객명</label>
    <input class="foms-input" id="wiz-customer-name" name="customer_name" data-wizard-field autocomplete="name" placeholder="예: 고명옥" @input="clear('customer_name')" />
    <p class="foms-wizard__error" x-show="has('customer_name')" x-text="errors.customer_name" role="alert"></p>
  </div>

  <div class="foms-wizard__field">
    <label class="field__label foms-wizard__label--required" for="wiz-phone">연락처</label>
    <input class="foms-input foms-tabular" id="wiz-phone" name="phone" data-wizard-field type="tel" autocomplete="tel" placeholder="010-0000-0000" @input="clear('phone')" />
    <p class="foms-wizard__error" x-show="has('phone')" x-text="errors.phone" role="alert"></p>
  </div>

  <div class="foms-wizard__field">
    <label class="field__label" for="wiz-orderer">발주사</label>
    <input class="foms-input" id="wiz-orderer" name="orderer" data-wizard-field placeholder="라홈 (계약서)" />
  </div>

  <div class="foms-wizard__field">
    <label class="field__label foms-wizard__label--required" for="wiz-address">주소</label>
    <input class="foms-input" id="wiz-address" name="address" data-wizard-field autocomplete="street-address" placeholder="주소 검색" @input="clear('address')" />
    <p class="foms-wizard__error" x-show="has('address')" x-text="errors.address" role="alert"></p>
  </div>

  <div class="foms-wizard__field">
    <label class="field__label" for="wiz-received-date">접수일</label>
    <input class="foms-input foms-tabular" id="wiz-received-date" name="received_date" data-wizard-field type="date" value="{{ today }}" />
  </div>
</section>
