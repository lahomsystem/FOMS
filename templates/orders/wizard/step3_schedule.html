<section class="foms-wizard__step" data-wizard-step="3" aria-labelledby="wizard-step3-title">
  <h2 class="foms-wizard__title" id="wizard-step3-title">일정 · 담당</h2>
  <p class="foms-wizard__subtitle">실측·시공 일정과 담당자를 입력해주세요</p>

  <div class="foms-wizard__grid-2">
    <div class="foms-wizard__field">
      <label class="field__label" for="wiz-measurement-date">실측일</label>
      <input class="foms-input foms-tabular" id="wiz-measurement-date" name="measurement_date" data-wizard-field data-schedule-field type="date" />
    </div>
    <div class="foms-wizard__field">
      <label class="field__label" for="wiz-measurement-time-mode">실측 시간</label>
      <select class="foms-select foms-tabular" id="wiz-measurement-time-mode" data-combo="time" data-combo-for="wiz-measurement-time">
        <option value="">선택</option>
        <option value="__custom__">직접 입력</option>
      </select>
      <input class="foms-input foms-tabular foms-wizard__combo-custom" id="wiz-measurement-time-custom" type="text" placeholder="직접 입력 (예: 오전, 14:30)" autocomplete="off" lang="ko" hidden />
      <input type="hidden" id="wiz-measurement-time" name="measurement_time" data-wizard-field data-schedule-field />
    </div>
    <div class="foms-wizard__field">
      <label class="field__label" for="wiz-construction-date">시공일</label>
      <input class="foms-input foms-tabular" id="wiz-construction-date" name="construction_date" data-wizard-field data-schedule-field type="date" />
    </div>
    <div class="foms-wizard__field">
      <label class="field__label" for="wiz-construction-time-mode">시공 시간</label>
      <select class="foms-select foms-tabular" id="wiz-construction-time-mode" data-combo="time" data-combo-for="wiz-construction-time">
        <option value="">선택</option>
        <option value="__custom__">직접 입력</option>
      </select>
      <input class="foms-input foms-tabular foms-wizard__combo-custom" id="wiz-construction-time-custom" type="text" placeholder="직접 입력 (예: 오전, 14:30)" autocomplete="off" lang="ko" hidden />
      <input type="hidden" id="wiz-construction-time" name="construction_time" data-wizard-field data-schedule-field />
    </div>
  </div>

  <div class="foms-wizard__grid-2">
    <div class="foms-wizard__field">
      <label class="field__label" for="wiz-sales-manager">영업 담당</label>
      <select class="foms-select" id="wiz-sales-manager" name="sales_manager" data-wizard-field data-schedule-field>
        <option value="">선택</option>
        {% for staff in wizard_sales_staff or [] %}<option value="{{ staff }}">{{ staff }}</option>{% endfor %}
      </select>
    </div>
    <div class="foms-wizard__field">
      <label class="field__label" for="wiz-construction-manager">시공 담당</label>
      <select class="foms-select" id="wiz-construction-manager" name="construction_manager" data-wizard-field data-schedule-field>
        <option value="">선택</option>
        {% for staff in wizard_construction_staff or [] %}<option value="{{ staff }}">{{ staff }}</option>{% endfor %}
      </select>
    </div>
  </div>

  <div class="foms-wizard__field">
    <span class="field__label" id="wiz-flags-label">주문 구분</span>
    <div class="foms-wizard__flags" role="group" aria-labelledby="wiz-flags-label">
      <label class="foms-wizard__flag" for="wiz-flag-regional">
        <input type="checkbox" id="wiz-flag-regional" data-wizard-field data-wizard-flag="regional_order" />
        <span class="foms-wizard__flag-body">
          <span class="foms-wizard__flag-ico" aria-hidden="true">🚚</span>
          <span class="foms-wizard__flag-txt">지방주문</span>
        </span>
      </label>
      <label class="foms-wizard__flag" for="wiz-flag-factory2">
        <input type="checkbox" id="wiz-flag-factory2" data-wizard-field data-wizard-flag="factory2" />
        <span class="foms-wizard__flag-body">
          <span class="foms-wizard__flag-ico" aria-hidden="true">🏭</span>
          <span class="foms-wizard__flag-txt">라홈시스템</span>
        </span>
      </label>
      <label class="foms-wizard__flag foms-wizard__flag--urgent" for="wiz-flag-urgent">
        <input type="checkbox" id="wiz-flag-urgent" data-wizard-field data-wizard-flag="urgent" />
        <span class="foms-wizard__flag-body">
          <span class="foms-wizard__flag-ico" aria-hidden="true">🔥</span>
          <span class="foms-wizard__flag-txt">긴급</span>
        </span>
      </label>
    </div>
  </div>

  <div class="foms-wizard__field" id="wiz-regional-type-field" hidden>
    <label class="field__label foms-wizard__label--required" for="wiz-regional-construction-type">지방주문 구분</label>
    <select class="foms-select" id="wiz-regional-construction-type" data-wizard-field data-wizard-flag="regional_construction_type">
      <option value="">하우드/협력사 선택</option>
      <option value="하우드 시공">하우드</option>
      <option value="협력사 시공">협력사</option>
    </select>
    <p class="foms-wizard__error" x-show="has('regional_construction_type')" x-text="errors.regional_construction_type" role="alert"></p>
    <label class="field__label foms-wizard__sub-label" for="wiz-load-date">상차일</label>
    <input class="foms-input foms-tabular" id="wiz-load-date" name="load_date" data-wizard-field data-schedule-field type="date" />
    <p class="foms-wizard__hint">상차일을 넣으면 지방 대시보드 &quot;상차 예정 알림&quot;으로 잡힙니다. (선택)</p>
  </div>

  <div class="foms-wizard__field" id="wiz-urgent-reason-field" hidden>
    <label class="field__label" for="wiz-urgent-reason">긴급 사유</label>
    <textarea class="foms-input" id="wiz-urgent-reason" data-wizard-field data-wizard-flag="urgent_reason" rows="2"
      placeholder="시공일 임박 / 현장 변경 / 자재 이슈"></textarea>
  </div>

  <div class="foms-wizard__field">
    <label class="field__label" for="wiz-notes">비고</label>
    <textarea class="foms-input" id="wiz-notes" name="notes" data-wizard-field data-schedule-field rows="3" placeholder="현장 특이사항, 주의사항"></textarea>
  </div>
</section>
