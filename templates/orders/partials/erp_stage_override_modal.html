{# 단계 강제 변경 모달 — PC/모바일 ERP Order 공용 (페이지당 1회 include) #}
{% set _can_stage_override = current_user is defined and current_user and current_user.role in ['ADMIN', 'MANAGER'] %}
<div class="modal fade" id="erpStageOverrideModal" tabindex="-1" aria-labelledby="erpStageOverrideModalLabel" aria-hidden="true"
     data-can-stage-override="{{ '1' if _can_stage_override else '0' }}">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="erpStageOverrideModalLabel">
                    <i class="fas fa-exchange-alt text-warning"></i> 단계 강제 변경
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="small text-muted mb-2">
                    역행·건너뛰기는 사유와 확인이 필요합니다. 도면·이관 이력은 삭제되지 않습니다.
                </p>
                <div class="mb-2">
                    <label class="form-label mb-0">현재 단계</label>
                    <div class="form-control form-control-sm bg-light" id="erp-stage-override-from" readonly>—</div>
                </div>
                <div class="mb-2">
                    <label class="form-label" for="erp-stage-override-to">목표 단계 <span class="text-danger">*</span></label>
                    <select class="form-select form-select-sm" id="erp-stage-override-to">
                        <option value="RECEIVED">A. 주문접수</option>
                        <option value="MEASURE">C. 실측</option>
                        <option value="DRAWING">D. 도면</option>
                        <option value="CONFIRM">E. 고객컨펌</option>
                        <option value="PRODUCTION">F. 생산</option>
                        <option value="CONSTRUCTION">G. 시공</option>
                        <option value="CS">H. CS</option>
                        <option value="COMPLETED">완료</option>
                    </select>
                    <div class="form-text" id="erp-stage-override-mode-hint"></div>
                </div>
                <div class="mb-2">
                    <label class="form-label" for="erp-stage-override-reason">사유 <span class="text-danger">*</span></label>
                    <textarea class="form-control form-control-sm" id="erp-stage-override-reason" rows="3"
                        placeholder="예: 실측 재방문 — 치수 오류 (비밀번호·개인정보 금지)"></textarea>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="erp-stage-override-confirm">
                    <label class="form-check-label" for="erp-stage-override-confirm">
                        이 변경이 의도된 운영 조치임을 확인합니다.
                    </label>
                </div>
                <div class="alert alert-danger py-2 mt-2 d-none" id="erp-stage-override-error" role="alert"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-warning" id="erp-stage-override-submit">
                    <i class="fas fa-check"></i> 강제 변경 실행
                </button>
            </div>
        </div>
    </div>
</div>
