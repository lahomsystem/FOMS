<!-- 채널톡 재전송: 변경 내용 입력 (PC modal / mobile bottom-sheet) -->
<div class="modal fade erp-channel-push-resend-modal" id="erpChannelPushResendModal" tabindex="-1"
    aria-labelledby="erp-channel-push-resend-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="erp-channel-push-resend-title">재전송 확인</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <label class="form-label fw-semibold mb-2" for="erp-channel-push-resend-note">변경 내용을 입력해주세요</label>
                <textarea class="form-control erp-autosize-textarea" id="erp-channel-push-resend-note" rows="3"
                    maxlength="500" placeholder="예: 손잡이 오기재 → 푸쉬로 정정" autocomplete="off" lang="ko"></textarea>
                <div class="form-text">5자 이상 입력 후 전송할 수 있습니다.</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                    data-erp-channel-push-resend-cancel>취소</button>
                <button type="button" class="btn btn-primary" id="erp-channel-push-resend-send-btn">
                    <i class="fas fa-paper-plane"></i> 전송
                </button>
            </div>
        </div>
    </div>
</div>
