<!-- 고객 공유 링크 모달 (Phase A T4): 발급·복사·카톡 공유·발급 이력·회수.
     토큰은 해시-온리 저장이라 URL 은 발급 직후 이 화면에서만 노출된다(플랜 §1). -->
<div class="modal fade" id="erpShareModal" tabindex="-1" aria-labelledby="erp-share-title"
    aria-hidden="true" data-kakao-js-key="{{ foms_kakao_share_js_key|default('') }}"
    data-share-logo-url="{{ url_for('static', filename='images/lahom-logo.png', _external=True) }}">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="erp-share-title">고객 공유 링크</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-warning py-2 px-2 mb-2 small d-none" id="erp-share-notice" role="alert" data-foms-no-autodismiss></div>
                <fieldset class="mb-2" id="erp-share-kind-group">
                    <legend class="visually-hidden">공유 종류</legend>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="erp-share-kind"
                            id="erp-share-kind-drawing" value="drawing" checked>
                        <label class="form-check-label" for="erp-share-kind-drawing">도면</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="erp-share-kind"
                            id="erp-share-kind-estimate" value="estimate">
                        <label class="form-check-label" for="erp-share-kind-estimate">견적서</label>
                    </div>
                </fieldset>
                <button type="button" class="btn btn-primary btn-sm" id="erp-share-create-btn">
                    <i class="fas fa-link"></i> 링크 발급
                </button>
                <div class="mt-3 d-none" id="erp-share-issued">
                    <label class="form-label small mb-1" for="erp-share-url">공유 주소 (지금만 복사 가능)</label>
                    <input type="text" class="form-control form-control-sm" id="erp-share-url" readonly>
                    {# 좁은 모달(폰 366px)에서 4버튼을 두 단어 라벨로 두면 글자가 세로로 접힌다.
                       라벨은 한 단어로 줄이고 뜻은 title 이 갖는다. #}
                    <div class="mt-2 erp-share-actions">
                        <button type="button" class="btn btn-success btn-sm"
                            id="erp-share-copy-btn" title="공유 주소를 클립보드에 복사합니다">
                            <i class="fas fa-copy"></i> 복사
                        </button>
                        <button type="button" class="btn btn-warning btn-sm"
                            id="erp-share-kakao-btn" title="카카오톡으로 열람 링크를 공유합니다">
                            <i class="fas fa-comment"></i> 카톡
                        </button>
                        <button type="button" class="btn btn-primary btn-sm"
                            id="erp-share-sms-btn"
                            title="고객 휴대폰으로 열람 링크를 문자(LMS)로 보냅니다">
                            <i class="fas fa-sms"></i> 문자
                        </button>
                        <button type="button" class="btn btn-info btn-sm"
                            id="erp-share-alimtalk-btn"
                            title="고객 휴대폰으로 알림톡을 보냅니다 (실패 시 자동으로 문자 대체발송)">
                            <i class="fas fa-paper-plane"></i> 알림톡
                        </button>
                    </div>
                    <div class="form-text">창을 닫으면 이 주소는 다시 볼 수 없습니다 — 필요하면 회수 후 재발급하세요.</div>
                </div>
                <hr>
                <div class="small text-muted mb-1">최근 발급 이력</div>
                <div id="erp-share-list" aria-live="polite"></div>
                <!-- 고객 열람 기록(SHARE-HIST-00) — 링크의 "고객이 본 내용" 을 누르면 여기에 편다.
                     계약서가 라이브 반영이라 같은 링크가 시점마다 다른 금액을 보여준다. -->
                <div id="erp-share-history" class="mt-2" aria-live="polite"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>
