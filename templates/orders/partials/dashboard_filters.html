<div class="erp-dashboard-filters w-100 bg-white" style="border-top: 1px solid #e9ecef; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; padding: 0.75rem 1.25rem;">
  <form method="get" action="{{ url_for('erp_dashboard.erp_dashboard') }}" class="d-flex align-items-center flex-wrap gap-3 m-0 w-100" id="erp-filters-form">
    {% if filters.get('alert_type') %}
    <input type="hidden" name="alert_type" value="{{ filters.get('alert_type') }}">
    {% endif %}

    <div class="d-flex align-items-center flex-nowrap" style="color: #6c757d; font-weight: 600; font-size: 0.95rem;">
      <i class="fas fa-filter me-1 text-primary"></i> <span class="d-none d-md-inline">필터</span>
    </div>

    <!-- Search -->
    <div class="input-group input-group-sm" style="width: auto; flex: 1; min-width: 200px; max-width: 320px;">
      <input type="text" class="form-control" name="q" placeholder="전체 검색..." value="{{ (filters.get('q') or '') }}">
      <button class="btn btn-primary fw-semibold" type="submit" aria-label="검색">
        <i class="fas fa-search"></i>
      </button>
    </div>

    <!-- Dropdowns -->
    <select class="form-select form-select-sm" name="stage" style="width: auto; min-width: 110px;" onchange="this.form.submit()">
      <option value="">단계: 전체</option>
      <option value="주문접수" {% if filters.get('stage')=='주문접수' %}selected{% endif %}>주문접수</option>
      <option value="실측" {% if filters.get('stage')=='실측' %}selected{% endif %}>실측</option>
      <option value="도면" {% if filters.get('stage')=='도면' %}selected{% endif %}>도면</option>
      <option value="고객컨펌" {% if filters.get('stage')=='고객컨펌' %}selected{% endif %}>고객컨펌</option>
      <option value="생산" {% if filters.get('stage')=='생산' %}selected{% endif %}>생산</option>
      <option value="시공" {% if filters.get('stage')=='시공' %}selected{% endif %}>시공</option>
      <option value="AS처리" {% if filters.get('stage')=='AS처리' %}selected{% endif %}>AS처리</option>
    </select>

    <select class="form-select form-select-sm" name="team" style="width: auto; min-width: 110px;" onchange="this.form.submit()">
      <option value="">담당팀: 전체</option>
      <option value="CS" {% if filters.get('team')=='CS' %}selected{% endif %}>라홈팀</option>
      <option value="SALES" {% if filters.get('team')=='SALES' %}selected{% endif %}>영업팀</option>
      <option value="MEASURE" {% if filters.get('team')=='MEASURE' %}selected{% endif %}>실측팀</option>
      <option value="DRAWING" {% if filters.get('team')=='DRAWING' %}selected{% endif %}>도면팀</option>
      <option value="PRODUCTION" {% if filters.get('team')=='PRODUCTION' %}selected{% endif %}>생산팀</option>
      <option value="CONSTRUCTION" {% if filters.get('team')=='CONSTRUCTION' %}selected{% endif %}>시공팀</option>
    </select>

    <!-- Checkboxes -->
    <div class="d-flex align-items-center gap-3 ms-md-2 my-1 my-md-0">
      <div class="form-check m-0 d-flex align-items-center gap-1">
        <input class="form-check-input m-0" type="checkbox" value="1" id="f-urgent" name="urgent" {% if filters.get('urgent')=='1' %}checked{% endif %} style="width: 1.1em; height: 1.1em; cursor: pointer;" onchange="this.form.submit()">
        <label class="form-check-label fw-semibold" for="f-urgent" style="font-size: 0.9rem; cursor: pointer; padding-top: 2px;">긴급만</label>
      </div>
      <div class="form-check m-0 d-flex align-items-center gap-1">
        <input class="form-check-input m-0" type="checkbox" value="1" id="f-has-alert" name="has_alert" {% if filters.get('has_alert')=='1' %}checked{% endif %} style="width: 1.1em; height: 1.1em; cursor: pointer;" onchange="this.form.submit()">
        <label class="form-check-label fw-semibold" for="f-has-alert" style="font-size: 0.9rem; cursor: pointer; padding-top: 2px;">경보만</label>
      </div>
      <div class="form-check m-0 d-flex align-items-center gap-1">
        <input class="form-check-input m-0" type="checkbox" value="1" id="f-mine" name="mine" {% if filters.get('mine')=='1' %}checked{% endif %} style="width: 1.1em; height: 1.1em; cursor: pointer;" onchange="this.form.submit()">
        <label class="form-check-label fw-semibold" for="f-mine" style="font-size: 0.9rem; cursor: pointer; padding-top: 2px;">내 담당</label>
      </div>
    </div>

    <!-- Reset -->
    <a class="btn btn-outline-secondary btn-sm fw-semibold ms-auto" href="{{ url_for('erp_dashboard.erp_dashboard') }}">
      <i class="fas fa-redo me-1"></i> <span class="d-none d-md-inline">초기화</span>
    </a>
  </form>
</div>
