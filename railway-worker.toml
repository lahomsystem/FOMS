# Worker 서비스 전용 Railway Config
# Railway 대시보드 > Worker 서비스 > Settings > Config Path: railway-worker.toml
[build]
# 참고(2026-09-29): 실제 빌드는 루트 Dockerfile 이다 — Railway 가 자동 감지하고 배포 manifest 의
# build.builder = DOCKERFILE(운영·스테이징 네 서비스 모두). 아래 builder 줄은 쓰이지 않는다.
builder = "nixpacks"

[deploy]
# rq worker 를 직접 띄우지 않는다 — start.sh 의 감시 루프가 Redis 재시작 시 러너를
# 다시 띄우고, 러너가 RQ_WORKER 하트비트를 남긴다(2026-09-08 운영 사고). 여기서 rq 를
# 직접 부르면 그 보호와 하트비트가 둘 다 사라진다.
startCommand = "sh start.sh"
