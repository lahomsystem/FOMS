name: perf-gate (staging)

# 하이브리드 게이트: deploy 푸시 = 비블로킹 advisory(조기 신호, 캐스케이드 방지) /
# production 승격 PR·수동 dispatch = 블로킹 하드 게이트. staging 회귀는 advisory 경고로
# 뜨고, 예산 재시드/근본수정은 별도 커밋으로 처리한다(무관 커밋 연쇄 fail 없음).
# 판정: 배포된 스테이징(lahom-dev)에 로그인 → 9 primary fragment 경로 측정 → 커밋된 예산 비교.
# exit 2(크리덴셜·로그인 실패)는 advisory 무관하게 job fail(측정 불가는 사고로 취급).
on:
  push:
    branches: [deploy]
    # docs/md-only 푸시는 런타임 성능에 영향 불가 → 배포 대기+실측 스킵.
    # 예산 파일은 tools/perf/perf_budgets.json(docs 밖)이라 안전.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [production]      # deploy→production 승격 PR = 블로킹 하드 게이트
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      mode:
        description: "gate = 평소 판정 · seed = 예산 재시드(커밋 안 함, artifact 로만)"
        type: choice
        options: [gate, seed]
        default: gate

# 빠른 연속 푸시의 중복 런은 취소(진행 중 런 노이즈·크레딧 낭비 감소).
concurrency:
  group: perf-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    # CI-TIMEOUT-01: 실측 median 2.1분.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 게이트 import 체인은 순수 stdlib(erp_navigation_contract) + requests(ept_b8 로그인,
      # staging_perf_gate) 뿐이라 flask/앱 전체 설치가 불필요하다 → requests 만.
      - name: Install minimal deps
        run: python -m pip install --upgrade pip requests brotli

      # push 이벤트에서만 이 커밋 SHA 의 배포 완료를 기다린다(구버전 재는 레이스 차단).
      # PR/dispatch 는 현재 살아있는 staging 을 그대로 측정한다(승격 후보 검증).
      - name: Wait for staging deploy (healthz commit == SHA)
        if: github.event_name == 'push'
        run: python tools/perf/wait_staging_deploy.py --sha "${{ github.sha }}" --timeout 600

      # deploy 푸시 = 비블로킹 advisory(예산 초과는 경고 어노테이션, exit 0 → 캐스케이드 방지).
      - name: Run staging perf gate (advisory on deploy push)
        if: github.event_name == 'push'
        env:
          FOMS_STAGING_USERNAME: ${{ secrets.FOMS_STAGING_USERNAME }}
          FOMS_STAGING_PASSWORD: ${{ secrets.FOMS_STAGING_PASSWORD }}
        run: python tools/perf/staging_perf_gate.py --advisory

      # production 승격 PR / 수동 dispatch = 블로킹 하드 게이트(예산 초과 → exit 1 → job fail).
      - name: Run staging perf gate (blocking on production promotion / manual)
        if: github.event_name != 'push' && inputs.mode != 'seed'
        env:
          FOMS_STAGING_USERNAME: ${{ secrets.FOMS_STAGING_USERNAME }}
          FOMS_STAGING_PASSWORD: ${{ secrets.FOMS_STAGING_PASSWORD }}
        run: python tools/perf/staging_perf_gate.py

      # TTFB 예산의 관측 기준은 **CI 러너**다. 로컬 --seed 는 reconcile_seed_budget 이
      # TTFB 갱신을 막으므로(로컬 네트워크가 심판석 값을 오염), 여기가 유일한 갱신 자리다.
      # 결과는 **커밋하지 않고 artifact 로만** 낸다 — 봇이 예산을 스스로 헐겁게 만들면
      # 게이트가 조용히 무력화된다. 사람이 diff 를 읽고 반영한다.
      - name: Re-seed budgets (manual dispatch, artifact only)
        if: inputs.mode == 'seed'
        env:
          FOMS_STAGING_USERNAME: ${{ secrets.FOMS_STAGING_USERNAME }}
          FOMS_STAGING_PASSWORD: ${{ secrets.FOMS_STAGING_PASSWORD }}
        run: |
          python tools/perf/staging_perf_gate.py --seed
          echo "--- budgets diff (사람이 읽고 반영한다) ---"
          git --no-pager diff -- tools/perf/perf_budgets.json || true

      - name: Upload re-seeded budgets
        if: inputs.mode == 'seed'
        uses: actions/upload-artifact@v4
        with:
          name: perf-budgets-seeded
          path: tools/perf/perf_budgets.json
          retention-days: 14

      # 판정 evidence 는 CI 에서 커밋하지 않고 artifact 로만 보존(로컬 실행과 무충돌).
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-evidence
          path: docs/harness/evidence/perf-gate-*.json
          retention-days: 14
          if-no-files-found: ignore
