name: Harness CI

on:
  push:
    branches: ["main", "deploy"]
  pull_request:
    # CI-PROMOTE-01: 승격 PR(base=production) 도 하네스 계약을 통과해야 한다.
    branches: ["main", "deploy", "production"]

# 같은 ref 에 연달아 푸시가 들어오면 앞선 런은 이미 의미가 없다. 2026-09-22 계측에서
# 12초 간격 deploy 푸시 2건이 각각 풀 CI 를 끝까지 태웠다(런 8개). 뒤 런만 남긴다.
concurrency:
  group: harness-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    # CI-TIMEOUT-01: 실측 median 1.3분.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Compile Cursor + Claude hooks
        run: python -m compileall -q .cursor/hooks .claude/hooks

      - name: Assert PowerShell availability
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Run harness tests
        run: python -m pytest tests/harness -q
        env:
          # app import 가 PG 준비성 프로브(STARTUP-PURE fail-closed)를 타지 않도록
          # ci.yml 과 동일하게 in-memory SQLite 로 선언(러너에 PostgreSQL 없음).
          DATABASE_URL: "sqlite:///:memory:"

      - name: Run verify-result baseline
        run: python tools/harness/verify_result.py --json
        env:
          DATABASE_URL: "sqlite:///:memory:"
