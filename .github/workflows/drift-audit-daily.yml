name: drift-audit-daily (production)

# 매일 새벽(KST 03:20) production 드리프트 감사 2종을 조회한다.
#   ① AS 축 투영(orders.as_axis_status) — tools/ops/audit_as_axis_drift.py
#   ② ERP flat 컬럼 정합       — foms/services/orders/erp_flat_audit.py
# 드리프트가 1건이라도 있으면 job fail → GitHub 알림. 결과는 step summary 에 표로 남는다.
#
# 조회로가 admin HTTP 엔드포인트인 이유: 운영 DB 접속 정보를 GitHub 에 두지 않기로 했다
# (등록된 비밀은 FOMS_STAGING_USERNAME/PASSWORD 둘뿐). rum-daily 와 같은 형태다.
#
# 판정 SSOT: foms/api/ops_drift.py 모듈 docstring
#   - AS 축 드리프트 = mismatch (missing_projection·legacy_only 은 그 부분집합이라 안 더함)
#   - ERP flat 드리프트 = SAFE + AMBIGUOUS (= total - CLEAN)
#
# 실행 시각: rum-daily(22:30 UTC = 07:30 KST)와 겹치지 않게 18:20 UTC(= 03:20 KST)로 둔다.
# ① 두 잡이 같은 production 인스턴스를 때리지 않게 4시간 이상 벌리고, ② ERP flat 감사는
# 전 주문 스캔이라 한국 새벽(사용자 트래픽 최저)에 돌려야 운영 부하가 눈에 띄지 않는다.
#
# 주의: schedule 은 **기본 브랜치(production)의 워크플로 파일만** 실행한다. 이 파일이
# production 에 승격돼야 cron 이 작동한다(deploy 에만 있으면 수동 dispatch 만 가능).
on:
  schedule:
    - cron: "20 18 * * *"  # 18:20 UTC = 03:20 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-audit:
    runs-on: ubuntu-latest
    # CI-TIMEOUT-01: 전 주문 스캔이라 조회 자체가 수십 초 걸릴 수 있다(앱 gunicorn
    # --timeout 120 이 상한). 2026-07 런 하나가 192.9분을 태우고 실패한 전례가 있어
    # job 에도 반드시 상한을 둔다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # drift_report_http 는 requests + ept_b8 로그인(requests) 만 쓴다 → requests 만.
      - name: Install minimal deps
        run: python -m pip install --upgrade pip requests

      - name: Fetch production drift audit
        env:
          FOMS_STAGING_USERNAME: ${{ secrets.FOMS_STAGING_USERNAME }}
          FOMS_STAGING_PASSWORD: ${{ secrets.FOMS_STAGING_PASSWORD }}
        run: python tools/ops/drift_report_http.py
