name: FOMS CI

on:
  push:
    branches: [ "main", "deploy" ]
  pull_request:
    branches: [ "main", "deploy" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    - name: Run design SSOT lint
      run: |
        python tools/design/ssot_lint.py docs/design
        
    - name: Run tests
      env:
        DATABASE_URL: "sqlite:///:memory:"
        SECRET_KEY: "ci-secret-key"
        FLASK_ENV: "testing"
      run: |
        python -m pytest -v --ignore=tests/visual -p no:playwright

  visual:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    - name: Install Playwright Chromium
      run: playwright install chromium --with-deps

    - name: Seed Linux baselines when missing or ERP v2 stale
      id: seed_linux
      env:
        DATABASE_URL: "sqlite:///tests/visual/visual_ci.sqlite"
        SECRET_KEY: "ci-secret-key"
        FLASK_ENV: "testing"
        ERP_MOBILE_V2_ENABLED: "false"
      run: |
        missing=$(python -c "from pathlib import Path; from tests.visual.conftest import missing_baseline_names, BASELINE_ROOT; print(len(missing_baseline_names(BASELINE_ROOT / 'linux')))")
        stale_erp=0
        if ! python scripts/ops/visual_erp_linux_stale.py; then
          stale_erp=1
        fi
        echo "missing=${missing}"
        echo "stale_erp=${stale_erp}"
        if [ "${missing}" = "0" ] && [ "${stale_erp}" = "0" ]; then
          echo "seeded=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "${missing}" != "0" ]; then
          pytest tests/visual/test_visual_regression.py tests/visual/test_erp_mobile_v2_shell_regression.py \
            --update-snapshots -q -p pytest_playwright
        else
          pytest tests/visual/test_erp_mobile_v2_shell_regression.py \
            --update-snapshots -q -p pytest_playwright
        fi
        echo "seeded=true" >> "$GITHUB_OUTPUT"

    - name: Commit Linux baselines
      if: steps.seed_linux.outputs.seeded == 'true'
      continue-on-error: true
      id: commit_linux
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add tests/visual/baseline/linux/*.png
        if git diff --staged --quiet; then
          echo "No baseline PNG changes to commit."
          exit 0
        fi
        git commit -m "chore: seed visual baselines linux SSOT [skip ci]"
        git push

    - name: Upload refreshed Linux baselines
      if: steps.seed_linux.outputs.seeded == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: visual-baseline-linux-refresh
        path: tests/visual/baseline/linux/*.png
        if-no-files-found: error

    - name: Run visual regression tests
      env:
        DATABASE_URL: "sqlite:///tests/visual/visual_ci.sqlite"
        SECRET_KEY: "ci-secret-key"
        FLASK_ENV: "testing"
        ERP_MOBILE_V2_ENABLED: "false"
        VISUAL_PIXEL_DIFF_THRESHOLD: "0.001"
      run: |
        pytest tests/visual/ -v -p pytest_playwright

    - name: Upload visual diff artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: visual-regression-diffs
        path: tests/visual/artifacts/
        if-no-files-found: ignore
