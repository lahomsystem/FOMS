name: FOMS CI

on:
  push:
    branches: [ "main", "deploy" ]
  pull_request:
    # CI-PROMOTE-01: 승격 PR 은 base=production 이라 [main, deploy] 필터에 걸리지
    # 않았다. 그래서 운영에 올라가는 코드가 이 5,329 개 스위트를 한 번도 통과한 적이
    # 없다 — "deploy 는 green 인데 production 만 터진" 사고 3건(solapi 미설치·
    # 마이그레이션 부모 누락·Docker 매니페스트)이 전부 이 구멍에서 나왔다.
    branches: [ "main", "deploy", "production" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # CI-TIMEOUT-01: 실측 median 14.1분 / max 15.4분. P0-1 이후 약 5분이 되므로 여유는 더 커진다.
    timeout-minutes: 25

    services:
      # RQ positive-path lane 전용 Redis. 2026-07-21 Redis 장애(레이트리미터 매 요청
      # 500) 이후에도 CI 에는 Redis 가 한 대도 없었다. 장애(fail-open) 계약은 stub 으로
      # 검증하므로 컨테이너가 필요 없고, 이 컨테이너는 stub 이 못 잡는 것 하나만 맡는다:
      # requirements 가 rq>=1.15.0 / redis>=5.0.0 처럼 상한 없는 floating 이라 CI 가
      # 매번 최신(현재 rq 2.5.x, 2.0 은 breaking 릴리스였다)을 당겨오는데, rq API 가
      # 바뀌면 get_rq_worker_count 가 조용히 0 을 반환한다. redis:7-alpine 은 ~15MB 라
      # 기동 비용이 무시 가능하다. REDIS_URL 은 여기서 전역으로 켜지 않는다 — 그 변수는
      # Socket.IO·dashboard micro-cache·rate limiter 까지 동시에 켜서 전체 스위트 거동을
      # 바꾼다(PG lane 의 FOMS_TEST_DATABASE_URL 분리와 같은 이유).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    - name: Run design SSOT lint
      run: |
        python tools/design/ssot_lint.py docs/design

    # CI-DOCSCOPE-01: 문서만 바뀐 커밋이 최근 100 런 중 44 건이었다. 그 커밋에도
    # 6,000+ 개 전체 스위트가 통째로 돌았다.
    #
    # 워크플로 자체를 paths-ignore 로 건너뛰지 않는다. 그러면 커밋에 FOMS CI 런이
    # 아예 없어지고, ci_watch 는 "런 없음" 을 green 과 구분하지 못한다. 대신 워크플로는
    # 항상 돌리고 무거운 스텝만 바꾼다 — 커밋마다 판정이 하나씩 남는다.
    #
    # 판단 불가(첫 푸시·force push·API 실패)는 전부 "문서 전용 아님" 으로 떨어뜨린다.
    # 틀렸을 때 비싼 쪽이 아니라 안전한 쪽으로 틀리게 한다.
    - name: Detect docs-only change
      id: scope
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        base="${{ github.event.pull_request.base.sha || github.event.before }}"
        if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "base 판정 불가 → 전체 스위트"
          exit 0
        fi
        if ! files=$(gh api "repos/${{ github.repository }}/compare/${base}...${{ github.sha }}" --jq '.files[].filename'); then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "compare API 실패 → 전체 스위트"
          exit 0
        fi
        if [ -z "$files" ]; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "변경 파일 목록이 비었다 → 전체 스위트"
          exit 0
        fi
        echo "변경 파일:"; echo "$files"
        if echo "$files" | grep -qvE '^docs/|[.]md$'; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "코드 변경 포함 → 전체 스위트"
        else
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
          echo "문서 전용 → 문서 계약 서브셋"
        fi
    - name: Run tests
      if: steps.scope.outputs.docs_only != 'true'
      env:
        DATABASE_URL: "sqlite:///:memory:"
        SECRET_KEY: "ci-secret-key"
        FLASK_ENV: "testing"
      run: |
        # tests/harness는 Harness CI job이 전담(이중 실행 제거), -q로 로그 절감
        # CI-XDIST-01: public repo 의 ubuntu-latest 는 4 vCPU 다. --dist loadfile 로
        # 파일 단위로 나눠, 같은 파일의 테스트는 한 워커에 머물게 한다(모듈 스코프
        # fixture 가 워커 경계에서 갈리지 않는다).
        python -m pytest -q --ignore=tests/visual --ignore=tests/harness -p no:playwright -n auto --dist loadfile

    # 문서 전용 커밋에도 "문서를 런타임에 읽는" 계약은 반드시 돈다. 목록이 낡으면
    # 문서 드리프트가 조용히 새므로, tests/domains/test_docs_facing_registry.py 가
    # 이 목록과 실제 스캔 결과가 같은지 못 박는다.
    - name: Run docs-facing contracts (docs-only change)
      if: steps.scope.outputs.docs_only == 'true'
      env:
        DATABASE_URL: "sqlite:///:memory:"
        SECRET_KEY: "ci-secret-key"
        FLASK_ENV: "testing"
      run: |
        python -m pytest -q -p no:playwright \
          tests/contracts/runtime/test_ptc_physical_exactness.py \
          tests/domains/test_api_error_containment.py \
          tests/domains/test_as_dashboard_schedule_link_render.py \
          tests/domains/test_audit_coverage_inventory.py \
          tests/domains/test_docs_facing_registry.py \
          tests/domains/test_failopen_inventory.py \
          tests/domains/test_foms_namespace_imports.py \
          tests/domains/test_order_detail_drift_banner.py \
          tests/domains/test_order_detail_two_phase_contract.py \
          tests/domains/test_release_gate.py \
          tests/domains/test_rev_99.py \
          tests/domains/test_settlement_channel_render.py \
          tests/domains/test_settlement_dashboard_render.py \
          tests/domains/test_settlement_operations_render.py \
          tests/domains/test_state_guard.py \
          tests/domains/test_stored_xss_sinks.py \
          tests/domains/test_table_version_counter.py \
          tests/domains/test_wizard_draft_send_routes.py \
          tests/performance/test_perf_regression_guard.py \
          tests/services/integrations/test_naver_origin_cleanup.py \
          tests/services/integrations/test_naver_refresh_all.py \
          tests/services/integrations/test_naver_return_wiring.py

    - name: Run Redis lane (RQ positive path / rq API drift)
      env:
        # 이 lane 에서만 켜지는 opt-in 변수. 미설정이면 해당 테스트는 skip 된다.
        FOMS_TEST_REDIS_URL: "redis://127.0.0.1:6379/15"
        DATABASE_URL: "sqlite:///:memory:"
        SECRET_KEY: "ci-secret-key"
        FLASK_ENV: "testing"
      run: |
        python -m pytest tests/domains/test_jobs_queue_redis_lane.py -q -p no:playwright

    # CI-VISUAL-01: tests/visual 은 본 스위트에서 --ignore 되므로, 브라우저 없이 도는
    # 파일은 여기 전부 등재한다. 목록이 낡으면 red 가 조용히 산다 —
    # test_erp_order_edit_mobile_form.py 의 red 가 2주 반 살았다.
    # tests/domains/test_visual_lane_registry.py 가 이 목록과 실제 파일 집합을 못 박는다.
    - name: Run UI structural tests (no Playwright PNG regression)
      env:
        DATABASE_URL: "sqlite:///:memory:"
        SECRET_KEY: "ci-secret-key"
        FLASK_ENV: "testing"
      run: |
        python -m pytest -q \
          tests/visual/test_alimtalk_ui_contract.py \
          tests/visual/test_baseline_policy.py \
          tests/visual/test_baseline_stale_policy.py \
          tests/visual/test_edit_order_mobile_v2_shell.py \
          tests/visual/test_erp_order_edit_mobile_form.py \
          tests/visual/test_mobile_notification_center.py \
          tests/visual/test_p1_mockup_chrome_parity.py \
          tests/visual/test_p1_mockup_home_parity.py \
          tests/visual/test_p1_mockup_png_baseline.py \
          tests/visual/test_p1_mockup_png_gate.py \
          tests/visual/test_p1_mockup_structure.py \
          tests/visual/test_p1_mockup_visual_gate.py \
          tests/visual/test_share_ui_contract.py \
          tests/visual/test_staging_mobile_v2_assets.py \
          tests/visual/test_wizard_send_ui_contract.py \
          -p no:playwright
