name: FOMS PostgreSQL Lane

# Opt-in real-PostgreSQL lane (PGTEST-00): schema on a throwaway foms_test_*
# database, plus the concurrency / lock / SKIP LOCKED packets that build on it.
# The main FOMS CI job runs on SQLite; this job provides a real PG 16 service.

on:
  push:
    branches: [ "main", "deploy" ]
  pull_request:
    # production 포함: 승격 PR 이 바로 predeploy(`alembic upgrade head`)가 도는 지점이다.
    # MIGCHAIN-01(test_migration_chain.py)이 여기서 돌아야 "마이그레이션이 실제로 실행되는지"
    # 를 승격 전에 확인할 수 있다(perf-gate 와 동일한 블로킹 지점).
    branches: [ "main", "deploy", "production" ]

permissions:
  contents: read

jobs:
  pg-lane:
    runs-on: ubuntu-latest
    # CI-TIMEOUT-01: 실측 median 2.2분.
    timeout-minutes: 20

    services:
      postgres:
        # 스테이징·운영이 PG 17.10 이므로 메이저를 맞춘다(2026-08-01). 이전 postgres:16 은
        # 한 세대 낮아 17 전용 회귀를 CI 가 못 잡는 사각이었다. PG17 "Migration to Version 17"
        # 비호환 17개 항목을 이 저장소가 쓰는 기능(CREATE INDEX CONCURRENTLY · gin_trgm_ops ·
        # partial unique index · DISTINCT ON · FOR UPDATE SKIP LOCKED)과 전수 대조해 해당 0건
        # 확인. 마이너는 floating 이라 운영 패치 레벨과 정확히 같지는 않다(메이저만 고정).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      # CI-DOCSCOPE-01: tests/postgres 는 docs/ 를 읽지 않는다(레지스트리 계약이
      # 스캔으로 확인). 문서만 바뀐 커밋에서 이 레인은 검증할 것이 없다.
      # 워크플로 자체는 건너뛰지 않는다 — 커밋마다 판정을 하나 남겨야 ci_watch 가
      # "런 없음" 과 green 을 혼동하지 않는다. 판단 불가는 전부 전체 실행으로 떨어뜨린다.
      - name: Detect docs-only change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(gh api "repos/${{ github.repository }}/compare/${base}...${{ github.sha }}" --jq '.files[].filename'); then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$files" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$files" | grep -qvE '^docs/|[.]md$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PostgreSQL lane
        if: steps.scope.outputs.docs_only != 'true'
        env:
          # Lane target: a LOCAL PG service (host 127.0.0.1 passes the safety guard).
          FOMS_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
          # App import still uses SQLite (root tests/conftest.py); the lane is isolated.
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key"
          FLASK_ENV: "testing"
        run: |
          python -m pytest tests/postgres -q -p no:playwright
