name: worker-heartbeat-daily (production)

# 매일 새벽(KST 03:50) production 워커 루프가 살아 있는지 확인한다.
#   tools/ops/heartbeat_report_http.py → /api/foms/ops/worker-heartbeats
# 멎은 루프가 하나라도 있으면 job fail → GitHub 알림. 결과는 step summary 에 표로 남는다.
#
# 왜 필요한가: check_sidefx_readiness 는 사람이 명령을 쳐야만 판정한다. 2026-02 워커
# offline 과 2026-08-31 SIDEFX 미배포는 두 번 다 사용자가 화면에서 먼저 발견했다.
# 재는 도구가 있어도 재는 사람이 없으면 없는 것과 같다.
#
# 조회로가 admin HTTP 엔드포인트인 이유: 운영 DB 접속 정보를 GitHub 에 두지 않기로 했다
# (등록된 비밀은 FOMS_STAGING_USERNAME/PASSWORD 둘뿐). drift-audit-daily 와 같은 형태다.
#
# 판정 SSOT: foms/api/ops_worker_heartbeat.py 모듈 docstring
#   - 필수 kind(outbox 3종)는 행이 없으면 not-ready(fail-closed)
#   - 표에 있는 나머지 loop kind 는 신선도를 본다(예산 = 신고 간격 x 3 과 등록부 값 중 큰 쪽)
#   - 등록부에 없는 kind 는 판정 불가로 실패 처리(조용히 넘기면 안 읽는 것과 같다)
#
# 실행 시각: drift-audit(18:20 UTC)·rum-daily(22:30 UTC)와 겹치지 않게 18:50 UTC
# (= 03:50 KST). 같은 production 인스턴스를 동시에 때리지 않게 30분 벌린다.
on:
  schedule:
    - cron: "50 18 * * *"  # 18:50 UTC = 03:50 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-heartbeat:
    runs-on: ubuntu-latest
    # CI-TIMEOUT-01: 하트비트 표는 행이 열 개 남짓이라 조회가 가볍지만, 상한 없는 job 이
    # 몇 시간을 태운 전례(2026-07, 192.9분)가 있어 반드시 상한을 둔다.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # heartbeat_report_http 는 requests + ept_b8 로그인(requests) 만 쓴다 → requests 만.
      - name: Install minimal deps
        run: python -m pip install --upgrade pip requests

      - name: Fetch production worker heartbeats
        env:
          FOMS_STAGING_USERNAME: ${{ secrets.FOMS_STAGING_USERNAME }}
          FOMS_STAGING_PASSWORD: ${{ secrets.FOMS_STAGING_PASSWORD }}
        run: python tools/ops/heartbeat_report_http.py
