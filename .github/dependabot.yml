# 의존성 업데이트 PR (SPEC docs/specs/2026-10-20-dependency-pins_SPEC.md)
# 기본 브랜치는 production 이라 target-branch 를 deploy 로 둔다 — 스테이징을 먼저 거친다.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "deploy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "deploy"
    schedule:
      interval: "monthly"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
